name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  discover-helper-releases:
    name: Discover helper migration and rescue releases
    runs-on: ubuntu-latest
    outputs:
      old_tags: ${{ steps.matrix.outputs.old_tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enumerate formal releases and fixed rescue RCs
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json tagName,isPrerelease,isDraft > "$RUNNER_TEMP/helper-releases.json"
          old_tags="$(python3 scripts/ci/helper_release_matrix.py \
            --releases "$RUNNER_TEMP/helper-releases.json" \
            --minimum v0.0.38 \
            --exclude "$TARGET_TAG" \
            --include v0.1.13-rc.28 \
            --include v0.1.13-rc.29 \
            --include v0.1.13-rc.30 \
            --include v0.1.13-rc.31 \
            --include v0.1.13-rc.32 \
            --include v0.1.13-rc.33 \
            --include v0.1.13-rc.34 \
            --include v0.1.13-rc.35 \
            --matrix-multiplier 5 \
            --max-jobs 256)"
          echo "old_tags=$old_tags" >> "$GITHUB_OUTPUT"
        id: matrix

  asr-preflight:
    name: Teams ASR preflight (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Managed ASR and voice transcription regressions
        shell: bash
        run: |
          set -euo pipefail
          # The real runtime and model are not downloaded here; those tests
          # skip without local assets.
          go test ./internal/asr ./internal/core/voice -count=1 -v
          go test ./internal/cli -count=1 -run 'Test(TeamsASR(ArgsFromEnvAndServiceOverrides|TranscriberDefaultsToManagedQwenRuntime|TranscriberReadsManagedLlamaEnv)|TeamsServiceInstallPreservesScopedEnvironment)$' -v

  teams-model-profile-preflight:
    name: Teams app-server and proxy preflight (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Proxy health cancellation regressions
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/manager -count=1 -run 'Test(HealthClient_CheckHTTPProxyContextCancellation|FindReusableInstanceContextHonorsCancellation)$' -v

      - name: Teams non-interactive stdin regressions
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/cli -count=1 -run 'Test(EnsureProxyPreference(ServiceDefaultsToDirectWithoutPrompt|NonTerminalDefaultsToDirectWithoutPrompt|NonInteractiveUsesConfiguredProfiles|NonInteractiveResetsIncompleteStateToDirect)|TeamsCodexLauncherModelProfileWithoutSSHServiceDefaultsDirectWhenProxyUnsetCI|RunTeamsUpgradeCodexOnceSkipsIncompleteProxyPreferenceCI|RunTeamsCodexUpgradeFromBridgeSkipsIncompleteProxyPreferenceCI|CodexInstallerCommandStdinDisabledFor(TeamsService|NonTerminal)|RunCodexInstallerDoesNotPassStdinInTeamsService|RunSystemNpmCodexUpgradeDoesNotPassStdinInTeamsService|ConfirmTeamsServiceUACPromptRejects(TeamsServiceModeWithoutReading|NonTerminalStdinWithoutBlocking)|InitProfileInteractiveRejects(TeamsServiceModeWithoutReading|NonTerminalStdinWithoutBlocking)|HistoryOpenExplicitProfileUsesProxyDespiteDisabledPreference|RunHistoryTuiExplicitProfileUsesProxyDespiteDisabledPreference)$' -v

      - name: Teams Graph proxy diagnostics regressions
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/cli -count=1 -run 'Test(TeamsGraphProxyLocalStatus(DoesNotProbeTeamsConnect|HonorsCancellation)|TeamsGraphHTTPClientLeaseStartFailureExplainsSilentTeams|TeamsServiceStartWarnsOnlyForRegisteredUnhealthyProxyDaemon|TeamsServiceDoctorReportsTeamsGraphProxyLocalStatus)$' -v

      - name: Codex per-turn reasoning effort regressions
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/codexrunner -count=1 -run '^TestAppServerRunner(StartThreadEncodesThreadStartAndTurnStart|ListModels.*)$' -v

  teams-runtime-preflight:
    name: Teams runtime preflight (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2022, windows-2025]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Detached terminal lifecycle regressions
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/cli -count=1 -run 'Test(DetachedDaemonSurvives(ParentSessionHangup|ConsoleControlEvent)|ProxyStartBackgroundConfiguresDetachedCommand|AppProxyLaunchConfiguresDetachedCommand|ModelAdapterLaunchConfiguresDetachedCommand|TeamsServiceDetachedCommandSetsHideWindowAndPreservesSysProcAttr)$' -v -timeout=60s

      - name: Install account shells (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo bash scripts/ci/apt_update.sh
          sudo env DEBIAN_FRONTEND=noninteractive bash scripts/ci/retry.sh 5 5 apt-get install -y --no-install-recommends zsh fish csh tcsh

      - name: Install account shells (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v fish >/dev/null 2>&1 || ! command -v nu >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              if HOMEBREW_NO_AUTO_UPDATE=1 brew install fish nushell; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                exit 1
              fi
              sleep $((attempt * 10))
            done
          fi

      - name: Teams account-default PATH through real shells (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          required_shells='sh bash zsh fish csh tcsh pwsh'
          if [ "$RUNNER_OS" = macOS ]; then
            required_shells="$required_shells nu"
          fi
          CODEX_HELPER_USER_PATH_LIVE=1 \
            CODEX_HELPER_USER_PATH_LIVE_SHELLS="$required_shells" \
            go test ./internal/userpath -count=1 -run '^TestAccountDefaultLiveShellMatrix$' -v

      - name: Teams account-default PATH through live Windows token and task principal
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:CODEX_HELPER_USER_PATH_WINDOWS_LIVE = "1"
          $env:CODEX_HELPER_WINDOWS_TASK_REGISTER_TEST = "1"
          go test ./internal/userpath -count=1 -run '^TestWindowsAccountDefaultLiveTokenEnvironment$' -v
          go test ./internal/cli -count=1 -run '^TestTeamsUserPathExpectedSIDMatchesLiveScheduledTaskPrincipalCI$' -v

      - name: CXP TUI preview, navigation, refresh, and thread-name regressions
        shell: bash
        run: |
          set -euo pipefail
          history_pattern='Test(ReadSessionPreviewMessages(DeduplicatesMirroredCodexEvents|DeduplicatesMirrorsWithDifferentSourceKinds|DeduplicatesMirroredUserAndStripsTeamsEnvelope|CleansEventOnlyUserPrompt|KeepsDistinctSameSourceIDsWithSameText|KeepsDistinctRepeatedUserPrompts|KeepsIdenticalCommentaryAndFinal|LimitCountsMirroredUserOnce)|ReadSessionPreviewText(AppendDeduplicatesMirroredMessage|ColdCacheRetainsSkippedMirrorSourceID)|ParseMessagePayload_PreservesTeamsHelperEnvelope|FirstPromptTitleText(StripsLastTeamsHelperSuffix|PreservesLeadingQuotedMarkerBeforeOuterSuffix)|ProcessMetaLine_SubagentFields|DiscoverProjects_SubagentAssociation|FlattenSessionGraphKeepsForkLineageSeparateFromSubagentClassification)$'
          tui_pattern='Test(IsPreviewNavKey|ApplyPreviewNavigation|PreviewArrowKeysScrollWhenFocused|RefreshState(UpdatesOrPreserves|PreservesSelectionIdentityAcrossListChanges)|SelectionIdentityLookupDoesNotAllocate|SelectSessionAutoRefreshPreservesSelection|HandleKeyEnterOpensTopLevelForkSession)$'
          go test ./internal/codexhistory -count=1 -run "$history_pattern" -v
          go test ./internal/tui -count=1 -run "$tui_pattern" -v
          go test ./internal/tui -run '^$' -bench '^BenchmarkResolveSelectionForDrawLargeHistory$' -benchtime=10x -count=1 -benchmem
          thread_name_history_pattern='^Test(ReadThreadNameIndexUsesLatestValidName|LoadThreadNameIndex(CachesUntilFileChanges|IsOptionalMetadata)|DiscoverProjects(AndFindSessionUseThreadNameIndex|PreservesPromptWithoutValidThreadName|RefreshesThreadNameWhenIndexChanges)|SessionThreadNameJSONIsBackwardCompatibleWhenEmpty)$'
          go test ./internal/codexhistory -count=1 -run "$thread_name_history_pattern" -v
          go test ./internal/tui -count=1 -run '^Test(BuildSessionItemsUsesCodexThreadName|SelectSessionAutoRefreshUpdatesThreadNameTitle)$' -v
          go test ./internal/cli -count=1 -run '^Test(HistoryListCmdTracksCodexThreadNameIndex|HistoryListCmdListsForkAsTopLevelSession)$' -v
          go test ./internal/codexhistory -run '^$' -bench '^BenchmarkLoadThreadNameIndexCached$' -benchtime=100x -count=1 -benchmem

      - name: Native Codex fork contract regressions
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/codexrunner -count=1 -run '^Test(AppServerLaunchContext|AppServerRunnerForkThread)' -v
          go test ./internal/cli -count=1 -run '^Test(Run(CodexForkSession|HistoryTuiForksOnlyValidatedMainSelection)|TeamsCodexExecutorReconcileForkThread)' -v
          go test ./internal/tui -count=1 -run '^Test(HandleKeyForksOnlyMainSession|HandleKeyEnterOpensTopLevelForkSession)$' -v

      - name: CXP preview SQLite correctness, concurrency, and write budgets
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/codexhistory -count=1 -run '^Test(SessionPreview(SQLite|CacheOff)|CacheV2|SessionMetaCatalog|ForkClassificationDoesNotReuseVersionTwoCatalogMetadata|DiscoverProjectsBatchesCatalog|HistoryCatalog|Catalog)' -v

      - name: CXP preview SQLite actual syscall write budget (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/session_preview_sqlite_io_smoke.sh

      - name: CXP cache v2 real NFS concurrency smoke (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/codexhistory_cache_nfs_smoke.sh

      - name: Patched-binary cleanup real HOME safety (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/tests/run_cleanup_patched_binaries_docker.sh

      - name: Managed Node and app-server environment contracts
        shell: bash
        run: |
          set -euo pipefail
          cli_pattern='Test(TeamsStandardRuntimeRefreshesManagedNodePATHAfterExecutorCreation|TeamsAppServerReceivesUserPathInsteadOfServiceOrManagedRuntime|ApplyTeamsUserPathRuntime.*|ResolveTeamsCodexUserPath.*|CommandLooksNative.*|RunCodexNewSessionUsesManagedNodeWithoutSystemNode|CodexRuntimeEnvironment.*|MergeCLIEnvironment.*|CodexAppAuthIdentityRuntimeEnvPrependsTargetManagedNode|RunTargetOnceWithOptionsRemovesRuntimeMarkers|StartCodexDesktopProcessPassesProxyArgAndEnv)$'
          process_pattern='Test(MergeAppServerProcessEnv.*|AppServerProcessStarter(RemovesInheritedRuntimeMarkers|RemovesRuntimeMarkersAfterConfiguration|NilConfiguredEnvironmentKeepsSanitizedParent)|AppServerRunnerRetries(LaunchFailureBeforeInitialization|TransportFailureDuringInitialization))$'
          go test ./internal/cli -count=1 -run '^TestNativeWindowsHTTPClient.*$' -v
          go test ./internal/cli -count=1 -run '^TestCodexAppAuthWindowsProxyBrowserScriptPassesIndependentArgsIntegration$' -v
          go test ./internal/cli -count=1 -run "$cli_pattern" -v
          go test ./internal/codexrunner -count=1 -run "$process_pattern" -v

      - name: CXP immutable runtime and process identity
        shell: bash
        run: |
          set -euo pipefail
          go test ./cmd/codex-proxy -count=1 -run 'TestRunMain(HandlesCandidateUpdateBeforeRuntimeDispatch|RunsLegacyPreflightBeforeRuntimeDispatch|PreflightFailureStopsBeforeRuntimeDispatch)$' -v
          go test ./internal/helperruntime -count=1 -run 'Test(NormalizeVersion|LauncherEnvironment.*|InstallVersion.*|PublishDownloaded.*|EnsureStableEntry.*|Current.*|RecoverPrevious.*|RuntimeProcessIdentity.*)$' -v
          go test ./internal/candidateupdate -count=1 -v
          go test ./internal/update -count=1 -run 'Test(Probe.*|PerformUpdatePublishesImmutableRuntimeAndSwitchesActive|ReplaceBinaryReplacesIdleExistingDestinationWindows)$' -v
          go test ./internal/cli -count=1 -run '^TestFinalizeHelperUpdateResult(AcceptsOlderStableDispatcher|RejectsUnrunnableStableDispatcher|RejectsStableDispatcherThatReactivatesOlderRuntime)$' -v
          go test ./internal/cli -count=1 -run 'Test(CurrentRuntimeOwnsUpdateTarget|PreferredCXPServiceEntryDoesNotUseUnrelatedRuntime|RefreshWindowsStableCXPExecutable.*|EnsureCXPShimForInstallPathNormalizesManagedWindowsCmdShim|CopyExecutableAtomicallyReplacesExistingFile|TeamsReleaseAutoUpdaterManagedRuntimeActivationUsesNormalRestart|TeamsAutoUpdateActivationAfterApply|RestartTeamsHelperAfterActivationPendingUsesInstalledPath)$' -v

      - name: Actual candidate-owned update and recovery (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/ci/candidate_owned_update_smoke.sh

      - name: Legacy rc.28-rc.35 runtime bridge (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/ci/legacy_runtime_bridge_smoke.sh

      - name: Legacy rc.28-rc.35 runtime bridge and restart recovery (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\ci\legacy_runtime_bridge_smoke.ps1

      - name: Stale copied cxp.exe entry update (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\ci\windows_stale_cxp_entry_smoke.ps1

      - name: Actual CXP process identity (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/ci/cxp_process_identity_smoke.sh

      - name: Actual CXP process identity (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\ci\cxp_process_identity_smoke.ps1

      - name: Ambiguous execution diagnostic regressions
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/codexrunner -count=1 -run 'Test(AppServerRunner(MetadataOnly(ResumeExcludesPersistedTurns|BackfillsExactCompletedTurnSummary|RejectsWrongTurnSummary|WrapsSummaryFailureAsIncompleteFinal|KeepsCompleteFinalWhenTitleBackfillFails)|LegacyTitleBackfillFailureRemainsError)|CompletedFinalAgentMessageForTurnsListRequiresExactCompletedTurn)$' -v

      - name: Teams explicit cancellation handoff regressions
        shell: bash
        run: |
          set -euo pipefail
          cancel_pattern='Test(AppServerRunner(ExplicitCancelInterruptsBeforeNextSameThreadTurn|InterruptAckDoesNotReleaseThreadBeforeTerminal|ExplicitCancelDuringTurnStartWaitsForExactInterrupt|TurnStartErrorWinningCancelRaceIsPreserved|UnconfirmedTurnStartReturnsStartedStatus|LifecycleCancelDoesNotInterruptTurn|UnconfirmedExplicitInterruptRetriesBeforeNextTurn|PersistentCancelFenceDoesNotStartSameThread|UnknownTurnCancelFenceWaitsForIdle|CompletionWinningCancelRaceDoesNotBlockNextTurn)|DecodeThreadIdle|AppServerTerminalNotificationForTurnRequiresExactTerminal)$'
          go test ./internal/codexrunner -count=1 -run "$cancel_pattern" -v

      - name: Teams test user-directory isolation guard
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/tests/check_teams_test_user_dir_isolation.sh

      - name: Teams runtime safety test isolation
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/tests/run_teams_runtime_safety_shard.sh isolation

      - name: Teams runtime safety Windows paths and service environment
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/tests/run_teams_runtime_safety_shard.sh windows

      - name: Teams core, store migration, and channel adapter regressions
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/core/... ./internal/channel/... -count=1

      - name: Teams runtime safety service and update lifecycle
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/tests/run_teams_runtime_safety_shard.sh service-update

      - name: Teams runtime safety WSL and process lifecycle
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/tests/run_teams_runtime_safety_shard.sh wsl-process

      - name: Teams runtime safety readiness and diagnostics
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/tests/run_teams_runtime_safety_shard.sh diagnostics

      - name: Teams self-echo containment and quarantine regressions
        shell: bash
        run: |
          set -euo pipefail
          cli_pattern='Test(TeamsChatQuarantineDryRunAndUnquarantine|TeamsChatQuarantineRejectsAmbiguousScopes|TeamsChatQuarantineRefusesLiveOwner|TeamsStatusSessionLayerReportsQuarantinedExplicitly|RepairRecordedHelperEntrypointsConvergesLegacyGoBinOnly|RepairRecordedHelperEntrypointsSkipsNonManagedRecord|TeamsServiceDoctorUsesInstalledWSLStartupFallbackWithoutScheduledTaskRequirement|TeamsServiceWSLStartupFallbackDoctorRejectsMismatchedMarker)$'
          go test ./internal/cli -count=1 -run "$cli_pattern" -v

      - name: Teams cross-machine registry regressions
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/cli -count=1 -run 'Test(Delegate|CandidatesFromMachineStatuses|RootCommandWiresExpectedSubcommandsAndFlags)' -v

      - name: Helper auto-update activation and cxp upgrade regressions
        shell: bash
        run: |
          set -euo pipefail
          cli_pattern='Test(UpgradeCmd(DefaultDoesNot(TouchTeamsServiceOrRequestUAC|RestartTeamsServiceAfterUpdateError)|IgnoresBrokenEnvInstallPathAndUnifiesAliases|UnifiesDefaultInstallAliasWhenCurrentGoBinWins|CreatesMissingCXPShimForManagedDefault|RepairsStaleCXPRegularFileForManagedDefault)|RewriteLegacyCXPProfile.*|EnsureCXPShimForInstallPath(RepairsStalePOSIXSymlink|CreatesWindowsCmdShim|RepairsWindowsCmdShim|KeepsNonHelperWindowsCmd)|TeamsReleaseAutoUpdaterApply(UsesRunningGoBinAndUnifiesManagedDefault|CreatesMissingCXPShim|UnifiesBrokenEnvAliases)|TeamsServiceInstall(SkipsBrokenEnvInstallPathAndRepairsManagedDefault|CreatesMissingManagedDefaultBeforeRepointingFromGoBin|CreatesMissingCXPShimWhenManagedTargetCurrent)|HandleUpdateAndRestartUnifiesCXPShimBeforeExec|RestartTeamsHelperAfterActivationPendingUsesInstalledPath|LegacyUpdater.*)$'
          go test ./internal/cli -count=1 -run "$cli_pattern" -v

  # A release publishes only a commit that passes both test tiers: the
  # pull-request tier (ci.yml) and the slow tier (nightly.yml: soak, fault
  # labs, the race sweep, the Linux-distro matrix, live installers and the
  # installed-Codex contracts).
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  nightly:
    uses: ./.github/workflows/nightly.yml
    permissions:
      contents: read

  goreleaser:
    runs-on: ubuntu-latest
    needs: [ci, nightly, asr-preflight, teams-model-profile-preflight, teams-runtime-preflight]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Apply curated release notes when present
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ ! -f "$notes" ]]; then
            echo "No curated release notes for ${GITHUB_REF_NAME}; keeping the generated changelog."
            exit 0
          fi
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file "$notes"

  publish-update-index:
    name: Publish static update index
    runs-on: ubuntu-latest
    needs: [goreleaser, install-smoke, helper-upgrade-compat-smoke, install-container-smoke]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update index branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/release.json"
          existing_index="$RUNNER_TEMP/existing-update-index.json"
          output_index="$RUNNER_TEMP/update-index.json"
          empty_index="$RUNNER_TEMP/empty-update-index.json"

          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,body,isDraft,isPrerelease,publishedAt,assets \
            > "$release_json"

          printf '{"version":1,"repo":"%s","releases":[]}\n' "$GITHUB_REPOSITORY" > "$empty_index"
          index_branch_exists=0
          if git ls-remote --exit-code origin refs/heads/auto-update-index >/dev/null 2>&1; then
            git fetch origin auto-update-index
            git show origin/auto-update-index:update-index.json > "$existing_index" 2>/dev/null || cp "$empty_index" "$existing_index"
            index_branch_exists=1
          else
            cp "$empty_index" "$existing_index"
          fi

          python3 scripts/release_update_index.py \
            --repo "$GITHUB_REPOSITORY" \
            --release-json "$release_json" \
            --existing-index "$existing_index" \
            --output "$output_index"

          if [[ "$index_branch_exists" == "1" ]]; then
            git checkout -B auto-update-index origin/auto-update-index
          else
            git checkout --orphan auto-update-index
          fi
          git rm -rf . >/dev/null 2>&1 || true
          cp "$output_index" update-index.json
          git add update-index.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "update-index.json already current"
            exit 0
          fi
          git commit -m "chore: update helper update index for ${GITHUB_REF_NAME}"
          git push origin auto-update-index

  install-smoke:
    name: Install smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [goreleaser]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2022, windows-2025]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./install.sh
          ./install.sh --repo "${GITHUB_REPOSITORY}" --version "${GITHUB_REF_NAME}" --dir "$HOME/.local/bin"
          codex_proxy_version="$("$HOME/.local/bin/codex-proxy" --version)"
          grep -q "${GITHUB_REF_NAME#v}" <<<"$codex_proxy_version"
          cxp_version="$("$HOME/.local/bin/cxp" --version)"
          grep -q "${GITHUB_REF_NAME#v}" <<<"$cxp_version"
          builtin_skill="$HOME/.agents/skills/cxp"
          test -f "$builtin_skill/SKILL.md"
          test -f "$builtin_skill/references/commands.md"
          grep -q "standard approval broker" "$builtin_skill/references/commands.md"
          "$HOME/.local/bin/codex-proxy" proxy doctor || true
          reset_out="$("$HOME/.local/bin/codex-proxy" --config "$RUNNER_TEMP/proxy-reset-smoke.json" proxy reset)"
          printf '%s\n' "$reset_out"
          grep -q 'profiles=0 instances=0 stopped=0 failed=0' <<<"$reset_out"
          grep -q 'Next launch will ask whether to configure proxy mode.' <<<"$reset_out"
          app_help="$("$HOME/.local/bin/cxp" app --help)"
          grep -q 'Install and launch the Codex desktop app' <<<"$app_help"
          root_help="$("$HOME/.local/bin/cxp" --help)"
          grep -q -- "--upgrade-codex-app" <<<"$root_help"
          app_auth_help="$("$HOME/.local/bin/cxp" app auth --help)"
          grep -q 'Authenticate Codex for the desktop app' <<<"$app_auth_help"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            if "$HOME/.local/bin/cxp" --config "$RUNNER_TEMP/codex-desktop-unsupported.json" app --cwd "$RUNNER_TEMP" >"$RUNNER_TEMP/codex-desktop-unsupported.out" 2>&1; then
              echo "cxp app unexpectedly succeeded on Linux" >&2
              cat "$RUNNER_TEMP/codex-desktop-unsupported.out" >&2
              exit 1
            fi
            grep -q "only available for macOS and Windows" "$RUNNER_TEMP/codex-desktop-unsupported.out"
          fi
          CODEX_HELPER_BIN="$HOME/.local/bin/codex-proxy" bash scripts/ci/skills_smoke.sh
          CODEX_HELPER_BIN="$HOME/.local/bin/codex-proxy" bash scripts/ci/skills_migration_smoke.sh
          CODEX_HELPER_BIN="$HOME/.local/bin/cxp" bash scripts/ci/skills_smoke.sh
          CODEX_HELPER_BIN="$HOME/.local/bin/cxp" bash scripts/ci/skills_migration_smoke.sh
          upgrade_target="$RUNNER_TEMP/codex-proxy-upgrade-smoke/codex-proxy"
          mkdir -p "$(dirname "$upgrade_target")"
          upgrade_skill_repo="$RUNNER_TEMP/codex-proxy-upgrade-skill-repo"
          mkdir -p "$upgrade_skill_repo/skills/review"
          cat > "$upgrade_skill_repo/skills/review/SKILL.md" <<'SKILL'
          ---
          name: review
          description: Upgrade migration smoke skill
          ---
          upgrade migration body
          SKILL
          git -C "$upgrade_skill_repo" init
          git -C "$upgrade_skill_repo" config user.name "Upgrade Skill Smoke"
          git -C "$upgrade_skill_repo" config user.email "upgrade-skill-smoke@example.invalid"
          git -C "$upgrade_skill_repo" add -A
          git -C "$upgrade_skill_repo" commit -m "initial upgrade skill"
          "$HOME/.local/bin/codex-proxy" skills add "$upgrade_skill_repo" --name upskill --ref HEAD --path skills/review --target codex-home --yes
          legacy_git_skill="$HOME/.codex/skills/upskill__review"
          agents_git_skill="$HOME/.agents/skills/upskill__review"
          test -f "$legacy_git_skill/SKILL.md"
          rm -rf "$agents_git_skill"
          legacy_builtin="$HOME/.codex/skills/cxp"
          rm -rf "$legacy_builtin"
          mkdir -p "$(dirname "$legacy_builtin")"
          cp -a "$builtin_skill" "$legacy_builtin"
          rm -rf "$builtin_skill"
          "$HOME/.local/bin/codex-proxy" upgrade --repo "${GITHUB_REPOSITORY}" --version "${GITHUB_REF_NAME}" --install-path "$upgrade_target"
          upgrade_version="$("$upgrade_target" --version)"
          grep -q "${GITHUB_REF_NAME#v}" <<<"$upgrade_version"
          test -f "$builtin_skill/SKILL.md"
          test -f "$builtin_skill/references/commands.md"
          test ! -e "$legacy_builtin"
          test -f "$agents_git_skill/SKILL.md"
          test ! -e "$legacy_git_skill"

      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $installDir = Join-Path $env:USERPROFILE ".local\\bin"
          .\\install.ps1 -Repo $env:GITHUB_REPOSITORY -Version $env:GITHUB_REF_NAME -InstallDir $installDir
          $exe = Join-Path $installDir "codex-proxy.exe"
          $cxpExe = Join-Path $installDir "cxp.exe"
          $cxp = Join-Path $installDir "cxp.cmd"
          & $exe --version | Select-String ($env:GITHUB_REF_NAME.TrimStart("v")) | Out-Null
          & $cxpExe --version | Select-String ($env:GITHUB_REF_NAME.TrimStart("v")) | Out-Null
          & $cxp --version | Select-String ($env:GITHUB_REF_NAME.TrimStart("v")) | Out-Null
          $builtinSkill = Join-Path $env:USERPROFILE ".agents\skills\cxp"
          if (!(Test-Path -LiteralPath (Join-Path $builtinSkill "SKILL.md"))) { throw "builtin cxp SKILL.md missing" }
          $builtinReference = Join-Path $builtinSkill "references\commands.md"
          if (!(Test-Path -LiteralPath $builtinReference)) { throw "builtin cxp command reference missing" }
          if ((Get-Content -Raw -LiteralPath $builtinReference) -notmatch "standard approval broker") { throw "builtin cxp command reference missing standard approval broker guidance" }
          & $exe proxy doctor | Out-Default
          $resetConfig = Join-Path $env:RUNNER_TEMP "proxy-reset-smoke.json"
          $resetOut = (& $exe --config $resetConfig proxy reset | Out-String)
          $resetOut | Out-Default
          if ($resetOut -notmatch "profiles=0 instances=0 stopped=0 failed=0") { throw "proxy reset smoke did not report empty reset counts" }
          if ($resetOut -notmatch "Next launch will ask whether to configure proxy mode.") { throw "proxy reset smoke did not mention next prompt" }
          & $cxp --help | Select-String "--upgrade-codex-app" | Out-Null
          & $cxp app --help | Select-String "Install and launch the Codex desktop app" | Out-Null
          & $cxp app auth --help | Select-String "Authenticate Codex for the desktop app" | Out-Null
          $env:CODEX_HELPER_BIN = $exe
          .\scripts\ci\skills_smoke.ps1
          .\scripts\ci\skills_migration_smoke.ps1
          $env:CODEX_HELPER_BIN = $cxp
          .\scripts\ci\skills_smoke.ps1
          .\scripts\ci\skills_migration_smoke.ps1
          Remove-Item Env:\CODEX_HELPER_BIN
          $upgradeDir = Join-Path $env:RUNNER_TEMP "codex-proxy-upgrade-smoke"
          New-Item -ItemType Directory -Force -Path $upgradeDir | Out-Null
          $upgradeTarget = Join-Path $upgradeDir "codex-proxy.exe"
          $upgradeSkillRepo = Join-Path $env:RUNNER_TEMP "codex-proxy-upgrade-skill-repo"
          New-Item -ItemType Directory -Force -Path (Join-Path $upgradeSkillRepo "skills\review") | Out-Null
          Set-Content -LiteralPath (Join-Path $upgradeSkillRepo "skills\review\SKILL.md") -NoNewline -Encoding UTF8 -Value @'
          ---
          name: review
          description: Upgrade migration smoke skill
          ---
          upgrade migration body
          '@
          & git -C $upgradeSkillRepo init
          & git -C $upgradeSkillRepo config user.name "Upgrade Skill Smoke"
          & git -C $upgradeSkillRepo config user.email "upgrade-skill-smoke@example.invalid"
          & git -C $upgradeSkillRepo add -A
          & git -C $upgradeSkillRepo commit -m "initial upgrade skill"
          & $exe skills add $upgradeSkillRepo --name upskill --ref HEAD --path skills/review --target codex-home --yes
          $legacyGitSkill = Join-Path $env:USERPROFILE ".codex\skills\upskill__review"
          $agentsGitSkill = Join-Path $env:USERPROFILE ".agents\skills\upskill__review"
          if (!(Test-Path -LiteralPath (Join-Path $legacyGitSkill "SKILL.md"))) { throw "legacy git skill missing before upgrade migration" }
          Remove-Item -Recurse -Force -LiteralPath $agentsGitSkill -ErrorAction SilentlyContinue
          $legacyBuiltin = Join-Path $env:USERPROFILE ".codex\skills\cxp"
          Remove-Item -Recurse -Force -LiteralPath $legacyBuiltin -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $legacyBuiltin) | Out-Null
          Copy-Item -Recurse -LiteralPath $builtinSkill -Destination $legacyBuiltin
          Remove-Item -Recurse -Force -LiteralPath $builtinSkill -ErrorAction SilentlyContinue
          & $exe upgrade --repo $env:GITHUB_REPOSITORY --version $env:GITHUB_REF_NAME --install-path $upgradeTarget
          & $upgradeTarget --version | Select-String ($env:GITHUB_REF_NAME.TrimStart("v")) | Out-Null
          if (!(Test-Path -LiteralPath (Join-Path $builtinSkill "SKILL.md"))) { throw "upgrade did not reinstall builtin cxp SKILL.md" }
          if (!(Test-Path -LiteralPath $builtinReference)) { throw "upgrade did not reinstall builtin cxp command reference" }
          if (Test-Path -LiteralPath $legacyBuiltin) { throw "upgrade did not hide legacy builtin cxp directory" }
          if (!(Test-Path -LiteralPath (Join-Path $agentsGitSkill "SKILL.md"))) { throw "upgrade did not migrate git subscription skill" }
          if (Test-Path -LiteralPath $legacyGitSkill) { throw "upgrade did not hide legacy git subscription directory" }

  helper-upgrade-compat-smoke:
    name: Helper upgrade compat (${{ matrix.target.os }}, ${{ matrix.target.service_backend }}, ${{ matrix.old_tag }} -> current)
    runs-on: ${{ matrix.target.os }}
    needs: [goreleaser, discover-helper-releases]
    strategy:
      fail-fast: false
      matrix:
        old_tag: ${{ fromJSON(needs.discover-helper-releases.outputs.old_tags) }}
        target:
          - os: ubuntu-latest
            service_backend: local-supervisor
          - os: ubuntu-latest
            service_backend: systemd-user
          - os: macos-15
            service_backend: launchd
          - os: windows-2022
            service_backend: windows-task
          - os: windows-2025
            service_backend: windows-task

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Split-entry upgrade convergence (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          REPO: ${{ github.repository }}
          OLD_TAG: ${{ matrix.old_tag }}
          TARGET_TAG: ${{ github.ref_name }}
          FETCHER: curl
          SERVICE_BACKEND: ${{ matrix.target.service_backend }}
        run: |
          set -euo pipefail
          bash scripts/ci/helper_upgrade_compat_smoke.sh

      - name: Split-entry upgrade convergence (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REPO: ${{ github.repository }}
          OLD_TAG: ${{ matrix.old_tag }}
          TARGET_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          .\scripts\ci\helper_upgrade_compat_smoke.ps1
          if ($env:OLD_TAG -eq "v0.1.12") {
            .\scripts\ci\windows_locked_cxp_self_upgrade.ps1 -ExpectedState Converged
          }

  install-container-smoke:
    name: Install smoke (containers)
    runs-on: ubuntu-latest
    needs: [goreleaser]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:20.04
            fetcher: curl
          - image: rockylinux:8
            fetcher: wget
          - image: centos:7
            fetcher: curl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install + run in ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          tag="${GITHUB_REF_NAME}"
          img="${{ matrix.image }}"
          fetcher="${{ matrix.fetcher }}"

          docker run --rm \
            -v "$PWD/scripts/ci:/ci:ro" \
            -e REPO="$repo" \
            -e TAG="$tag" \
            -e FETCHER="$fetcher" \
            "$img" bash /ci/container_install_smoke.sh
