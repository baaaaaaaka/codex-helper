name: Live official and NVIDIA model routing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/model-routing-live.yml"
      - "internal/cli/model_profile_launch.go"
      - "internal/cli/teams_codex_runtime_contract.go"
      - "internal/cli/teams_model_profile.go"
      - "internal/cli/teams_codex_runner.go"
      - "internal/cli/teams.go"
      - "internal/cli/unified_model_gateway.go"
      - "internal/cli/unified_model_gateway_live_test.go"
      - "internal/modelprofile/**"
      - "internal/responsesadapter/**"
  workflow_dispatch:
  schedule:
    - cron: "19 9 * * *"

permissions:
  contents: read

jobs:
  live-routing:
    if: vars.MODEL_ROUTING_LIVE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install official Codex and build CXP
        shell: bash
        run: |
          set -euo pipefail
          export CODEX_NPM_PREFIX="$RUNNER_TEMP/cxp-managed-codex"
          npm install -g --prefix "$CODEX_NPM_PREFIX" --include=optional @openai/codex@latest
          go build -o "$RUNNER_TEMP/cxp" .
          "$CODEX_NPM_PREFIX/bin/codex" --version
          echo "CODEX_NPM_PREFIX=$CODEX_NPM_PREFIX" >> "$GITHUB_ENV"

      - name: Prepare isolated regulated-account and NVIDIA profile
        shell: bash
        env:
          CODEX_LIVE_AUTH_JSON: ${{ secrets.CODEX_LIVE_AUTH_JSON }}
          NVIDIA_INFERENCE_HUB_KEY: ${{ secrets.CXP_LIVE_NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${CODEX_LIVE_AUTH_JSON:-}"
          test -n "${NVIDIA_INFERENCE_HUB_KEY:-}"
          live_home="$RUNNER_TEMP/codex-live-routing"
          config_path="$RUNNER_TEMP/cxp-live-routing.json"
          install -d -m 700 "$live_home"
          printf '%s' "$CODEX_LIVE_AUTH_JSON" > "$live_home/auth.json"
          chmod 600 "$live_home/auth.json"
          printf '%s' "$NVIDIA_INFERENCE_HUB_KEY" | "$RUNNER_TEMP/cxp" --config "$config_path" model-profile setup nvidia-nemotron \
            --provider chat-compatible \
            --base-url https://inference-api.nvidia.com/v1 \
            --model nvidia/nvidia/eccn-nemotron-3-ultra \
            --api-key-stdin \
            --no-doctor
          {
            echo "CODEX_HELPER_LIVE_UNIFIED_GATEWAY=1"
            echo "CODEX_HELPER_LIVE_CODEX_PATH=$CODEX_NPM_PREFIX/bin/codex"
            echo "CODEX_HELPER_LIVE_CONFIG_PATH=$config_path"
            echo "CODEX_HELPER_LIVE_MODEL_PROFILE=nvidia-nemotron"
            echo "CODEX_HELPER_LIVE_THIRD_MODEL=nvidia/nvidia/eccn-nemotron-3-ultra"
            echo "CODEX_HELPER_LIVE_OFFICIAL_MODEL=gpt-5.6-luna"
            echo "CODEX_HELPER_LIVE_CODEX_HOME=$live_home"
            echo "CODEX_HOME=$live_home"
          } >> "$GITHUB_ENV"

      - name: Verify official to NVIDIA to official routing
        shell: bash
        env:
          HTTP_PROXY: ${{ secrets.CXP_LIVE_HTTP_PROXY }}
          HTTPS_PROXY: ${{ secrets.CXP_LIVE_HTTP_PROXY }}
        run: |
          set -euo pipefail
          test -n "${HTTP_PROXY:-}"
          go test ./internal/cli -run '^TestLive(UnifiedModelGatewayWithRealCodex|TeamsOfficialCatalogWithResolvedRuntime)OptIn$' -count=1 -v -timeout=12m
