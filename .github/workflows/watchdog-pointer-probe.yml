name: Native watchdog pointer probe
on:
  push:
    branches: [probe/watchdog-pointer-lock]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
          cache: true
      - name: Reproduce the exclusive pointer precondition and recovery
        shell: pwsh
        run: go test ./internal/cli -run '^TestTeamsServiceWatchdogRuntimeRefreshRecoversSharingViolation$' -count=1 -v
