name: Nightly

# The slow tier: soak and stress runs, fault labs, the full race sweep, the
# full OS and Linux-distro matrix, live installers and services, and the
# installed-Codex contracts. Pull requests run ci.yml (under 10 minutes);
# this runs every night, on demand, and before every release (release.yml
# calls it and publishes only when it passes).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platform-integration:
    name: Platform integration (${{ matrix.os }} / ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Only the checks the per-OS full unit suite (ci.yml) cannot make:
        # env-gated live tests, real installers and services, smokes of built
        # binaries, network installs of Codex and its dependencies, and
        # benchmarks. Plain `go test -run` subsets of the full suite are not
        # repeated here.
        include:
          - os: ubuntu-latest
            shard: platform-integration
          - os: macos-latest
            shard: platform-integration
          - os: windows-latest
            shard: platform-integration
          - os: ubuntu-latest
            shard: state-perf
          - os: ubuntu-latest
            shard: scripts
          - os: macos-latest
            shard: scripts
          - os: windows-latest
            shard: scripts
          - os: windows-latest
            shard: windows-skills-desktop
          - os: windows-latest
            shard: windows-skills-desktop-b
          - os: windows-latest
            shard: windows-codex-e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Script unit tests (macOS)
        if: matrix.shard == 'scripts' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Patched-binary cleanup real HOME safety (Linux only)
        if: matrix.shard == 'scripts' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/tests/run_cleanup_patched_binaries_docker.sh

      - name: Install PATH activation matrix (Linux only)
        if: matrix.shard == 'platform-integration' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo bash scripts/ci/apt_update.sh
          sudo env DEBIAN_FRONTEND=noninteractive bash scripts/ci/retry.sh 5 5 apt-get install -y --no-install-recommends zsh fish csh tcsh
          CODEX_PROXY_REQUIRE_SHELL_MATRIX=1 bash scripts/ci/install_path_activation_matrix.sh

      - name: Install PATH activation matrix (macOS only)
        if: matrix.shard == 'platform-integration' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v fish >/dev/null 2>&1 || ! command -v nu >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              if HOMEBREW_NO_AUTO_UPDATE=1 brew install fish nushell; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                exit 1
              fi
              sleep $((attempt * 10))
            done
          fi
          CODEX_PROXY_REQUIRE_SHELL_MATRIX=1 bash scripts/ci/install_path_activation_matrix.sh

      - name: Teams account-default PATH through real shells (Linux/macOS)
        if: matrix.shard == 'platform-integration' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Exercise only shells deliberately installed/prepared by the
          # platform matrix. Ubuntu images may contain pwsh, but PowerShell's
          # Unix -Login startup can hang in the hosted non-interactive runner;
          # its adapter/protocol contracts remain covered by focused tests.
          required_shells='sh bash zsh fish csh tcsh'
          if [ "$RUNNER_OS" = macOS ]; then
            required_shells="$required_shells nu"
          fi
          CODEX_HELPER_USER_PATH_LIVE=1 \
            CODEX_HELPER_USER_PATH_LIVE_SHELLS="$required_shells" \
            go test ./internal/userpath -count=1 -run '^TestAccountDefaultLiveShellMatrix$' -v

      - name: Script unit tests (Windows)
        if: matrix.shard == 'scripts' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          py -3 -m unittest discover -s scripts/tests -p "test_*.py"

      - name: Actual candidate-owned update and recovery (Linux/macOS)
        if: matrix.shard == 'platform-integration' && runner.os != 'Windows'
        shell: bash
        run: bash scripts/ci/candidate_owned_update_smoke.sh

      - name: Legacy rc.28-rc.35 runtime bridge (Linux/macOS)
        if: matrix.shard == 'platform-integration' && runner.os != 'Windows'
        shell: bash
        run: bash scripts/ci/legacy_runtime_bridge_smoke.sh

      - name: Legacy rc.28-rc.35 runtime bridge and restart recovery (Windows)
        if: matrix.shard == 'platform-integration' && runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\ci\legacy_runtime_bridge_smoke.ps1

      - name: Reproduce v0.1.12 locked CXP self-upgrade split (Windows)
        if: matrix.shard == 'platform-integration' && runner.os == 'Windows'
        shell: pwsh
        env:
          REPO: ${{ github.repository }}
          OLD_TAG: v0.1.12
          TARGET_TAG: v0.1.13-rc.53
        run: .\scripts\ci\windows_locked_cxp_self_upgrade.ps1 -ExpectedState Split

      - name: Actual CXP process identity (Linux/macOS)
        if: matrix.shard == 'platform-integration' && runner.os != 'Windows'
        shell: bash
        run: bash scripts/ci/cxp_process_identity_smoke.sh

      - name: Actual CXP process identity (Windows)
        if: matrix.shard == 'platform-integration' && runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\ci\cxp_process_identity_smoke.ps1

      - name: CXP preview SQLite actual syscall write budget (Linux only)
        if: matrix.shard == 'state-perf' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/session_preview_sqlite_io_smoke.sh

      - name: CXP cache v2 real NFS concurrency smoke (Linux only)
        if: matrix.shard == 'state-perf' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/codexhistory_cache_nfs_smoke.sh

      - name: Setup managed ASR Python version for dependency availability
        if: matrix.shard == 'platform-integration'
        id: managed-asr-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Teams managed ASR dependency availability (Linux/macOS)
        if: matrix.shard == 'platform-integration' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys, venv; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)'
          bash scripts/ci/retry.sh 3 5 python3 -m pip index versions qwen-asr | grep -F '0.0.6'
          bash scripts/ci/retry.sh 3 5 python3 -m pip index versions imageio-ffmpeg | grep -F '0.6.0'
          bash scripts/ci/retry.sh 3 5 python3 -m pip index versions torch | grep -E '2\.(4|5|6|7|8|9|10|11|12)\.'
          check_url() {
            local url="$1"
            local status
            echo "checking $url"
            for attempt in 1 2 3; do
              status="$(curl -sSIL -o /dev/null -w '%{http_code}' --max-time 30 "$url" || true)"
              if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
                return 0
              fi
              if [[ "$status" == "404" || "$status" == "410" ]]; then
                echo "missing managed ASR asset ($status): $url" >&2
                return 1
              fi
              if [ "$attempt" = 3 ]; then
                if [[ "$status" == "408" || "$status" == "429" || "$status" =~ ^5[0-9][0-9]$ ]]; then
                  echo "::warning::managed ASR asset check was rate-limited or temporarily unavailable after retries (HTTP $status): $url"
                  return 0
                fi
                echo "managed ASR asset check failed with HTTP ${status:-unknown}: $url" >&2
                return 1
              fi
              sleep 5
            done
          }
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)
              target=x86_64-unknown-linux-gnu
              llama_urls=(
                "https://github.com/ggml-org/llama.cpp/releases/download/b9437/llama-b9437-bin-ubuntu-vulkan-x64.tar.gz"
                "https://github.com/ggml-org/llama.cpp/releases/download/b9437/llama-b9437-bin-ubuntu-x64.tar.gz"
              )
              ffmpeg_url="https://files.pythonhosted.org/packages/a0/2d/43c8522a2038e9d0e7dbdf3a61195ecc31ca576fb1527a528c877e87d973/imageio_ffmpeg-0.6.0-py3-none-manylinux2014_x86_64.whl"
              ;;
            Linux-aarch64|Linux-arm64)
              target=aarch64-unknown-linux-gnu
              llama_urls=(
                "https://github.com/ggml-org/llama.cpp/releases/download/b9437/llama-b9437-bin-ubuntu-vulkan-arm64.tar.gz"
                "https://github.com/ggml-org/llama.cpp/releases/download/b9437/llama-b9437-bin-ubuntu-arm64.tar.gz"
              )
              ffmpeg_url="https://files.pythonhosted.org/packages/33/e7/1925bfbc563c39c1d2e82501d8372734a5c725e53ac3b31b4c2d081e895b/imageio_ffmpeg-0.6.0-py3-none-manylinux2014_aarch64.whl"
              ;;
            Darwin-x86_64)
              target=x86_64-apple-darwin
              llama_urls=("https://github.com/ggml-org/llama.cpp/releases/download/b9437/llama-b9437-bin-macos-x64.tar.gz")
              ffmpeg_url="https://files.pythonhosted.org/packages/da/58/87ef68ac83f4c7690961bce288fd8e382bc5f1513860fc7f90a9c1c1c6bf/imageio_ffmpeg-0.6.0-py3-none-macosx_10_9_intel.macosx_10_9_x86_64.whl"
              ;;
            Darwin-arm64)
              target=aarch64-apple-darwin
              llama_urls=("https://github.com/ggml-org/llama.cpp/releases/download/b9437/llama-b9437-bin-macos-arm64.tar.gz")
              ffmpeg_url="https://files.pythonhosted.org/packages/40/5c/f3d8a657d362cc93b81aab8feda487317da5b5d31c0e1fdfd5e986e55d17/imageio_ffmpeg-0.6.0-py3-none-macosx_11_0_arm64.whl"
              ;;
            *) echo "unsupported CI platform for managed Python check: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          url="https://github.com/astral-sh/python-build-standalone/releases/download/20260510/cpython-3.10.20+20260510-${target}-install_only_stripped.tar.gz"
          check_url "$url"
          check_url "https://huggingface.co/ggml-org/Qwen3-ASR-0.6B-GGUF/resolve/928ab958557df9aa2ef1c93e0e83c7ad0933fae2/Qwen3-ASR-0.6B-Q8_0.gguf"
          check_url "https://huggingface.co/ggml-org/Qwen3-ASR-0.6B-GGUF/resolve/928ab958557df9aa2ef1c93e0e83c7ad0933fae2/mmproj-Qwen3-ASR-0.6B-Q8_0.gguf"
          check_url "$ffmpeg_url"
          for url in "${llama_urls[@]}"; do
            check_url "$url"
          done
          release_asset_urls=(
            "https://github.com/ggml-org/llama.cpp/releases/download/b9437/llama-b9437-bin-ubuntu-vulkan-x64.tar.gz"
            "https://github.com/ggml-org/llama.cpp/releases/download/b9437/llama-b9437-bin-ubuntu-x64.tar.gz"
            "https://github.com/ggml-org/llama.cpp/releases/download/b9437/llama-b9437-bin-macos-x64.tar.gz"
            "https://github.com/ggml-org/llama.cpp/releases/download/b9437/llama-b9437-bin-macos-arm64.tar.gz"
            "https://github.com/ggml-org/llama.cpp/releases/download/b9437/llama-b9437-bin-win-vulkan-x64.zip"
            "https://github.com/ggml-org/llama.cpp/releases/download/b9437/llama-b9437-bin-win-cpu-x64.zip"
            "https://files.pythonhosted.org/packages/a0/2d/43c8522a2038e9d0e7dbdf3a61195ecc31ca576fb1527a528c877e87d973/imageio_ffmpeg-0.6.0-py3-none-manylinux2014_x86_64.whl"
            "https://files.pythonhosted.org/packages/da/58/87ef68ac83f4c7690961bce288fd8e382bc5f1513860fc7f90a9c1c1c6bf/imageio_ffmpeg-0.6.0-py3-none-macosx_10_9_intel.macosx_10_9_x86_64.whl"
            "https://files.pythonhosted.org/packages/40/5c/f3d8a657d362cc93b81aab8feda487317da5b5d31c0e1fdfd5e986e55d17/imageio_ffmpeg-0.6.0-py3-none-macosx_11_0_arm64.whl"
            "https://files.pythonhosted.org/packages/2c/c6/fa760e12a2483469e2bf5058c5faff664acf66cadb4df2ad6205b016a73d/imageio_ffmpeg-0.6.0-py3-none-win_amd64.whl"
          )
          for url in "${release_asset_urls[@]}"; do
            check_url "$url"
          done

      - name: Teams managed ASR dependency availability (Windows)
        if: matrix.shard == 'platform-integration' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $managedAsrPython = "${{ steps.managed-asr-python.outputs.python-path }}"
          & $managedAsrPython -c "import sys, venv; raise SystemExit(0 if sys.version_info[:2] == (3, 10) else 1)"
          function Invoke-Retry([scriptblock]$Command) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                & $Command
                return
              } catch {
                if ($attempt -eq 3) {
                  throw
                }
                Start-Sleep -Seconds 5
              }
            }
          }
          Invoke-Retry {
            $out = & $managedAsrPython -m pip index versions qwen-asr
            if (-not ($out | Select-String -SimpleMatch "0.0.6")) { throw "qwen-asr 0.0.6 not listed" }
          }
          Invoke-Retry {
            $out = & $managedAsrPython -m pip index versions imageio-ffmpeg
            if (-not ($out | Select-String -SimpleMatch "0.6.0")) { throw "imageio-ffmpeg 0.6.0 not listed" }
          }
          Invoke-Retry {
            $out = & $managedAsrPython -m pip index versions torch
            if (-not ($out | Select-String -Pattern "2\.(4|5|6|7|8|9|10|11|12)\.")) { throw "supported torch version not listed" }
          }
          function Test-ManagedASRAsset([string]$Url) {
            Write-Host "checking $Url"
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri $Url -Method Head -MaximumRedirection 5 -TimeoutSec 30 -SkipHttpErrorCheck
                $status = [int]$response.StatusCode
                if ($status -ge 200 -and $status -lt 300) {
                  return
                }
                if ($status -eq 404 -or $status -eq 410) {
                  throw "missing managed ASR asset ($status): $Url"
                }
                if ($attempt -eq 3 -and ($status -eq 408 -or $status -eq 429 -or ($status -ge 500 -and $status -lt 600))) {
                  Write-Host "::warning::managed ASR asset check was rate-limited or temporarily unavailable after retries (HTTP $status): $Url"
                  return
                }
                throw "managed ASR asset check failed with HTTP ${status}: $Url"
              } catch {
                if ($attempt -eq 3) {
                  throw
                }
                Start-Sleep -Seconds 5
              }
            }
          }
          $target = "x86_64-pc-windows-msvc"
          $url = "https://github.com/astral-sh/python-build-standalone/releases/download/20260510/cpython-3.10.20+20260510-$target-install_only_stripped.tar.gz"
          Test-ManagedASRAsset $url
          Test-ManagedASRAsset "https://huggingface.co/ggml-org/Qwen3-ASR-0.6B-GGUF/resolve/928ab958557df9aa2ef1c93e0e83c7ad0933fae2/Qwen3-ASR-0.6B-Q8_0.gguf"
          Test-ManagedASRAsset "https://huggingface.co/ggml-org/Qwen3-ASR-0.6B-GGUF/resolve/928ab958557df9aa2ef1c93e0e83c7ad0933fae2/mmproj-Qwen3-ASR-0.6B-Q8_0.gguf"
          Test-ManagedASRAsset "https://files.pythonhosted.org/packages/2c/c6/fa760e12a2483469e2bf5058c5faff664acf66cadb4df2ad6205b016a73d/imageio_ffmpeg-0.6.0-py3-none-win_amd64.whl"
          Test-ManagedASRAsset "https://github.com/ggml-org/llama.cpp/releases/download/b9437/llama-b9437-bin-win-vulkan-x64.zip"
          Test-ManagedASRAsset "https://github.com/ggml-org/llama.cpp/releases/download/b9437/llama-b9437-bin-win-cpu-x64.zip"

      - name: Setup SSHD for integration tests (Linux only)
        if: matrix.shard == 'platform-integration' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo bash scripts/ci/apt_update.sh
          sudo bash scripts/ci/retry.sh 5 5 apt-get install -y openssh-server
          sudo mkdir -p /run/sshd
          SSH_TEST_USER="ssh-test"
          if ! id -u "$SSH_TEST_USER" >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash -p '$6$ci$WiNqQDjl.EMvmwex4uixbzCpYwPdZ5pjMhtV6AMb004JamOVMOgqYaNOYOgWVmv/1Eq9TSb.yuZ94xGrgVNuS/' "$SSH_TEST_USER"
          fi
          SSH_TEST_DIR="$(mktemp -d)"
          ssh-keygen -t ed25519 -N "" -f "$SSH_TEST_DIR/host_key"
          ssh-keygen -t ed25519 -N "" -f "$SSH_TEST_DIR/test_key"
          sudo install -d -m 700 -o "$SSH_TEST_USER" -g "$SSH_TEST_USER" "/home/$SSH_TEST_USER/.ssh"
          sudo install -m 600 -o "$SSH_TEST_USER" -g "$SSH_TEST_USER" "$SSH_TEST_DIR/test_key.pub" "/home/$SSH_TEST_USER/.ssh/authorized_keys"
          chmod 700 "$SSH_TEST_DIR"
          chmod 600 "$SSH_TEST_DIR/test_key" "$SSH_TEST_DIR/test_key.pub" "$SSH_TEST_DIR/host_key"
          cat > "$SSH_TEST_DIR/sshd_config" <<EOF
          Port 22222
          ListenAddress 127.0.0.1
          HostKey $SSH_TEST_DIR/host_key
          AuthorizedKeysFile /home/$SSH_TEST_USER/.ssh/authorized_keys
          PasswordAuthentication no
          ChallengeResponseAuthentication no
          KbdInteractiveAuthentication no
          UsePAM no
          PermitRootLogin no
          PubkeyAuthentication yes
          StrictModes no
          AllowTcpForwarding yes
          PermitOpen any
          PidFile $SSH_TEST_DIR/sshd.pid
          AllowUsers ${SSH_TEST_USER}
          LogLevel ERROR
          EOF
          sudo /usr/sbin/sshd -t -f "$SSH_TEST_DIR/sshd_config"
          sudo /usr/sbin/sshd -f "$SSH_TEST_DIR/sshd_config"
          for _ in {1..20}; do
            if ssh -i "$SSH_TEST_DIR/test_key" -p 22222 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes \
              "${SSH_TEST_USER}@127.0.0.1" exit; then
              break
            fi
            sleep 0.2
          done
          {
            echo "SSH_TEST_HOST=127.0.0.1"
            echo "SSH_TEST_PORT=22222"
            echo "SSH_TEST_USER=${SSH_TEST_USER}"
            echo "SSH_TEST_KEY=$SSH_TEST_DIR/test_key"
          } >> "$GITHUB_ENV"

      - name: SSH live integration regressions (Linux only)
        if: matrix.shard == 'platform-integration' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          SSH_TEST_ENABLED=1 go test ./internal/ssh -count=1 -run 'TestTunnelIntegration(StartStop|AcceptsNewHostKey)$' -v
          SSH_TEST_ENABLED=1 SSH_STACK_INTEGRATION_TEST=1 go test ./internal/stack -count=1 -run 'TestStackIntegrationHTTPProxyConnectThroughSSHTunnel$' -v
          SSH_TEST_ENABLED=1 SSH_CONFIG_PROFILE_INIT_TEST=1 go test ./internal/cli -count=1 -run 'TestInitProfileSSHConfigProfileIntegration$' -v

      - name: SSH accept-new client support
        if: matrix.shard == 'platform-integration'
        shell: bash
        run: |
          set -euo pipefail
          SSH_ACCEPT_NEW_OPTION_TEST=1 go test ./internal/ssh -count=1 -run 'TestOpenSSHAcceptNewOptionSupported$' -v

      - name: Teams background keepalive regressions (Linux/macOS)
        if: matrix.shard == 'platform-integration' && runner.os != 'Windows'
        shell: bash
        env:
          CODEX_HELPER_TEAMS_TOKEN_CACHE: ${{ runner.temp }}/teams-missing-token.json
          CODEX_HELPER_TEAMS_READ_TOKEN_CACHE: ${{ runner.temp }}/teams-missing-read-token.json
          CODEX_HELPER_TEAMS_FILE_WRITE_TOKEN_CACHE: ${{ runner.temp }}/teams-missing-file-token.json
        run: |
          set -euo pipefail
          teams_cli_keepalive='Test(TeamsBackgroundKeepalive|TeamsRecover(.*)|RestartSelfExecsSameBinaryWithCurrentArgs|TeamsHelperReload|DiscoverTeamsPendingHelperActivation.*|TeamsService(WindowsStartTasksRefreshesTaskState|WindowsElevatedScriptCapturesInnerErrors|WSLStartTasksRefreshTaskState|InstallWritesSystemdUserUnitWithoutEnabling|InstallDefaultsCodexHomeForScope|InstallDoesNotFailWhenDefaultCodexHomeCannotBeDerived|InstallWritesMacOSLaunchAgentPlist|InstallWritesWindowsTaskXMLAndRegistersTask|InstallWritesWSLWindowsTask|InstallWindowsAccessDeniedPromptsForUAC|InstallWindowsAccessDeniedYesUsesUACWithoutPrompt|InstallWindowsCleanupAccessDeniedUsesUAC|SystemctlStop(IgnoresMissingWatchdogUnits|StillFailsWhenPrimaryStopFails)|StartAndRestartActivatePendingWindowsHelperBeforeOldEntry|Environment(MirrorsSingleCodexHomeEnv|ResolvesRelativeCodexDirEnv|PreservesConflictingExplicitCodexHomes)|Bootstrap(ShowsControlChatInForeground|CanSkipAutomaticControlChatOpen|PreparesControlChatWith(ServiceCodexHomeEnv|RelativeCodexDirEnv|ResolvedRegistryPath)|WindowsAccessDeniedPromptsForUAC|WindowsAccessDeniedNoUACFailsWithoutPrompt|NoStartWindowsAccessDeniedPromptsForUAC|PendingActivationWindowsAccessDeniedPromptsForUAC)|OpenURLCommandMatrix|DoctorReportsWSLHint|DoctorReportsWSLReadinessFailure|RunPowerShellIncludesCombinedOutputOnFailure|ActiveQueriesSupervisorWithoutGeneratedConfig)|ScheduleDelayedTeamsServiceStartUses(WSLWindowsTask|ConfiguredPowerShell|WindowsPendingActivation)|TeamsServiceDetached.*|UpgradeCmd.*)'
          teams_service_cleanup_pattern='Test(TeamsService(RetireLocalBridgeProcessesFiltersRegistryProfileAndWatchdog|UpgradeRetiresLargeRunAndWatchdogPileBeforeRestart|PrimaryRestartRetiresOnlyLocalBridgeProcessesBeforeStart|StartRetiresLocalBridgeProcessesOnlyWhenWSLTaskInactive|StartDoesNotRetireLocalBridgeProcessesWhenWSLTaskActive|PrimaryStartDoesNotRetireLocalBridgeProcessesWhenWSLTaskActive|RestartRetiresLargeLocalBridgePileBeforeStart|RestartDoesNotStartWhenBridgeCleanupFails|RepairCleansWindowsBridgeChildrenBeforeTaskRewrite|Watchdog(DefaultsAvoidTransientRestartLoops|WaitsForConsecutiveStaleSamples))|RunTeamsServiceWatchdogOnce(RestartsAfterConsecutiveStaleState|RequiresPersistentStaleAndResetsOnFreshOwner|SuccessfulRestartCooldownSuppressesRestartStorm|DoesNotCooldownFailedRestart))$'
          go test ./internal/cli -count=1 -run "$teams_cli_keepalive" -v
          go test ./internal/cli -count=1 -run "$teams_service_cleanup_pattern" -v
          go test ./internal/update -count=1 -run 'Test(WindowsDeferredMoveScript(WaitsRetriesAndEscapesPaths|SafetyInvariantsStress)|FindPendingReplacementsForPlatformSortsHighestAndParsesWindowsAssets|ProbeBinaryVersionParsesCodexProxyVersion)$' -v

      - name: Teams background keepalive regressions (Windows)
        if: matrix.shard == 'platform-integration' && runner.os == 'Windows'
        shell: pwsh
        env:
          CODEX_HELPER_TEAMS_TOKEN_CACHE: ${{ runner.temp }}\teams-missing-token.json
          CODEX_HELPER_TEAMS_READ_TOKEN_CACHE: ${{ runner.temp }}\teams-missing-read-token.json
          CODEX_HELPER_TEAMS_FILE_WRITE_TOKEN_CACHE: ${{ runner.temp }}\teams-missing-file-token.json
        run: |
