name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

# A pull request can otherwise leave several generations of the same expensive
# matrix running at once. Canceling superseded revisions keeps hosted runners
# available for the current commit and removes stale callbacks from the CI
# signal that reviewers use to make a decision.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  teams-math-runtime:
    name: Teams rendering and math fallbacks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Safe TeX, rendering, hosted content, and math font regressions
        shell: bash
        run: |
          set -euo pipefail
          # The math renderer and its font are exercised through stand-in
          # binaries and a local server; nothing is downloaded.
          go test ./internal/channel/teams -count=1 -run 'Math|TeX|Render|Hosted' -v

  proxy-recovery-loopback:
    name: Proxy recovery loopback fault lab (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Run deterministic proxy fault lab
        shell: bash
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
          NO_PROXY: "127.0.0.1,localhost"
        run: |
          set -euo pipefail
          go test -p=1 ./internal/proxysupervisor -count=1 -run 'Test(RenderAllPlatforms|SpecValidation|ChildArgs)' -v
          go test -p=1 ./internal/localproxy -count=1 -run 'Test(GenerationRouter|HTTPProxyGenerationSwapHasNoListenerRefusedWindow|HTTPProxyGenerationRouter|HTTPProxyChainMatrix|HTTPProxyDNSAlias|ProxyHopHeaderParsing|ProxyHop|ProbeSOCKS5|SOCKS5Dialer|HTTPProxyHealthProbe|HTTPProxyNotifiesBackendFailure|HTTPProxyBackendDeadlineNotifiesWhenRequestContextIsLive|HTTPProxyCloseClosesActiveHijackedTunnels|HTTPProxyRealSocketFaultRelay|HTTPProxyAllProxyHTTPURLSupportsCONNECT|DistinctLoopback)' -v
          go test -p=1 ./internal/manager -count=1 -run 'Test(HealthClient_CheckHTTPProxyRouteTargetUsesRealConnect|OwnedInstanceOpsFenceStaleDaemon|IsProxyOwnerLeaseStale)' -v
          go test -p=1 ./internal/hoststate -count=1 -v
          go test -p=1 ./internal/stack -count=1 -run 'Test(WaitForSOCKS5|NotifyNetworkResume|RequestFailureRecoveryBudgetIsBounded|StackHelpers|StackCloseIsConcurrentSafe|Monitor|ProbeGapDetectedStripsMonotonicClock|TunnelExitAfterWallClockGapWaitsForHostBeforeRecovery|SetupHTTPProxy)' -v
          go test -p=1 ./internal/ssh -count=1 -run 'Test(BuildArgs|TunnelStopTerminatesProcessGroupDescendants)' -v
          go test -p=1 ./internal/cli -count=1 -run '^Test(HealthClientForProxy(Profile|Target)(UsesExplicitRouteTarget|DoesNotProbeSSHConfigAliasWithoutRouteTarget|DoesNotProbeProxyJumpEndpointWithoutRouteTarget|RejectsIncompleteOrInvalidTargets)|InitProfileInteractiveWithDepsUsesSSHConfigProfile)$' -v
          go test -p=1 ./internal/stack -count=1 -run '^Test(RouteProbe(UsesExplicitTargetForSSHConfigAlias|SkipsSSHConfigAliasWithoutExplicitTarget)|RouteTargetRequiresExplicitDestination)$' -v
          go test -p=1 ./internal/cli -count=1 -run '^Test(Claim(LegacyProxyInstancePersistsOwnerLease|ProxyInstance)|ProxyStartRemovesPlaceholderWhenExecutableResolutionFails|RunProxyDaemonWithOwnerToken(CleansPlaceholderWhenProfileMissing|DoesNotOverwriteReplacement)|ProxyStop|ProxySupervisor|ManagedProxyDaemon)' -v
          go test -p=1 ./internal/cli -count=1 -run '^TestProxy(List|Prune)' -v -timeout=60s
          go test -p=1 ./internal/appgateway -count=1 -run '^TestRegistryLoadReadOnly' -v -timeout=60s
          go test -p=1 ./internal/proc -count=1 -run '^TestCheckAlive' -v -timeout=60s
          go test -p=1 ./internal/cli -count=1 -run 'Test(WindowsProxyReachabilityScriptExecutesAgainstLiveProxy|EnsureCodexAppProxyURLDoesNotProbeSSHConfigAliasWithoutRouteTarget|CodexAppAuth(MacProxyBrowser.*|WindowsProxy(ReachabilityScriptChecksHealthEndpoint|BrowserScriptUsesChromiumProxy)))$' -v
          go test -p=1 ./internal/cli -count=1 -run 'Test(DetachedDaemonSurvives(ParentSessionHangup|ConsoleControlEvent)|ProxyStartBackgroundConfiguresDetachedCommand|AppProxyLaunchConfiguresDetachedCommand|ModelAdapterLaunchConfiguresDetachedCommand)$' -v -timeout=60s

      - name: macOS unprivileged proxy fault matrix
        if: runner.os == 'macOS'
        shell: bash
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
          NO_PROXY: "127.0.0.1,localhost"
        run: |
          set -euo pipefail
          # These tests inject connection close, half-open SOCKS, route
          # failure, candidate failure, resume bursts, and request-failure
          # storms entirely through loopback. They do not require sudo,
          # pfctl, networksetup, or suspending the hosted macOS runner.
          go test -p=1 ./internal/localproxy -count=5 -run 'Test(HTTPProxyChainMatrix|HTTPProxyDNSAlias|ProxyHopHeaderParsing|HTTPProxyGenerationRouterRecoversAfterSOCKSFailure|HTTPProxyGenerationSwapHasNoListenerRefusedWindow|GenerationRouterSwapKeepsListenerAndFencesOldGeneration|GenerationRouterDialContextCancelsBackend|GenerationRouterDrainRejectsLateDialAfterForcedClose|SOCKS5DialerContextCancelsHalfOpenHandshake|HTTPProxyHealthProbeIsSingleFlightAndCached|HTTPProxyRealSocketFaultRelay|HTTPProxyRepeatedStartCloseResourceBudget|HTTPProxyBackendDeadlineNotifiesWhenRequestContextIsLive|HTTPProxyCloseClosesActiveHijackedTunnels|ProbeSOCKS5|HTTPProxyNotifiesBackendFailure|DistinctLoopback)' -v
          go test -p=1 ./internal/hoststate -count=5 -v
          go test -p=1 ./internal/stack -count=5 -run 'Test(Monitor(RecoversTunnelAndSwapsProxyGeneration|RetriesCandidateAfterDeadTunnel|NetworkResumeRecoversFailedRemoteProbe|CandidateFailureKeepsLiveActiveTunnel|DetectsProbeGapAsResume)|SuspendDoesNotConsumeRecoveryBudgetAfterTunnelExit|WakeWaitsForHostBeforeCreatingCandidate|ProbeGapDetectedStripsMonotonicClock|TunnelExitAfterWallClockGapWaitsForHostBeforeRecovery|NotifyNetworkResumeCoalesces|RequestFailureRecoveryBudgetIsBounded|StackCloseIsConcurrentSafe|SetupHTTPProxyBackendFailure(SignalsAreCoalesced|StormCountsRawRequestsAndOneSignal))' -v

  windows-proxy-lifecycle:
    name: Windows proxy lifecycle and managed runtime update
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Run deterministic Windows lifecycle and exact-target tests
        shell: pwsh
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
          NO_PROXY: "127.0.0.1,localhost"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          go test -p=1 ./internal/helperruntime -count=1 -run 'Test(ShouldActivateEntryVersionDoesNotUndoSameBasePrerelease|LaunchKeepsExplicitSameBasePrereleaseActive|Current|EnsureStableEntry|InstallVersion|PublishDownloaded)' -v
          # Keep the process-identity fixture in the native Windows gate. Its
          # child publishes a readiness marker and inspects Windows process
          # metadata; a Linux cross-compile cannot exercise either behavior.
          go test -p=1 ./internal/helperruntime -count=1 -run '^TestRuntimeProcessIdentityWindows$' -v
          go test -p=1 ./internal/candidateupdate -count=1 -run 'Test(WindowsCandidateOwned|WindowsDeferred|Reconcile|ResumePending|StableReplacement|Apply|SamePath)' -v
          go test -p=1 ./internal/update -count=1 -run 'Test(PerformUpdate|ReplaceBinary|Probe)' -v
          go test -p=1 ./internal/cli -count=1 -run 'Test(StartDetachedProcessWaitsForExitedChild|ProxyStart|StartCodexAppProxyDaemon|AppProxyLaunchConfiguresDetachedCommand|ModelAdapterLaunchConfiguresDetachedCommand|WindowsProxy|TeamsServiceDetachedCommandSetsHideWindowAndPreservesSysProcAttr|DetachedDaemonSurvivesConsoleControlEvent|CurrentRuntimeOwnsUpdateTarget)' -v
          go test -p=1 ./internal/hoststate -count=1 -v
          go test -p=1 ./internal/localproxy ./internal/stack ./internal/ssh -count=1 -run 'Test(HTTPProxyChain|HTTPProxyDNSAlias|GenerationRouter|HTTPProxyRepeatedStartCloseResourceBudget|HTTPProxyHealthProbeIsSingleFlightAndCached|Monitor|SuspendDoesNotConsumeRecoveryBudgetAfterTunnelExit|WakeWaitsForHostBeforeCreatingCandidate|RequestFailure|NotifyNetworkResume|TunnelProcess)' -v

      - name: Capture Windows lifecycle diagnostics
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "== process tree =="
          Get-CimInstance Win32_Process | Select-Object ProcessId,ParentProcessId,Name,ExecutablePath,CommandLine | Format-List
          Write-Host "== listeners =="
          Get-NetTCPConnection -ErrorAction SilentlyContinue | Select-Object LocalAddress,LocalPort,RemoteAddress,RemotePort,State,OwningProcess | Format-Table

  proxy-recovery-docker:
    name: Proxy recovery Docker network fault lab
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Run SSH/SOCKS network disconnect and reconnect smoke
        shell: bash
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
          NO_PROXY: "127.0.0.1,localhost"
        run: |
          set -euo pipefail
          bash scripts/ci/proxy_recovery_docker_smoke.sh

  proxy-recovery-soak:
    name: Proxy recovery bounded soak and resource budget
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Repeat fault and resource budgets
        shell: bash
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
          NO_PROXY: "127.0.0.1,localhost"
        run: |
          set -euo pipefail
          go test -p=1 ./internal/localproxy -count=5 -run '^Test(HTTPProxyRepeatedStartCloseResourceBudget|HTTPProxyHealthProbeIsSingleFlightAndCached)$' -v
          go test -p=1 ./internal/hoststate -count=5 -v
          go test -p=1 ./internal/stack -count=5 -run 'Test(Monitor|SuspendDoesNotConsumeRecoveryBudgetAfterTunnelExit|WakeWaitsForHostBeforeCreatingCandidate|ProbeGapDetectedStripsMonotonicClock|TunnelExitAfterWallClockGapWaitsForHostBeforeRecovery|RequestFailureGate|ClassifyRequestFailure|NotifyNetworkResume|SetupHTTPProxyBackendFailureStormCountsRawRequestsAndOneSignal)' -v

  app-gateway-lifecycle:
    name: App Gateway lifecycle contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Stable port, wake admission, migration, and service contracts
        shell: bash
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
          NO_PROXY: "127.0.0.1,localhost"
        run: |
          set -euo pipefail
          go test -p=1 ./internal/appgateway -count=1 -run 'Test(Registry|Frontend|Probe|Service)' -v
          go test -p=1 ./internal/stack -count=1 -run '^TestProbeHostNetwork' -v
          go test -p=1 ./internal/cli -count=1 -run '^Test(CodexAppDefaultProxyEnsurer|EnsureAppGateway|RunAppGateway|DesktopProxy|ParseWindows|ParseDarwin|DiscoverDesktop|ParseProxy|AppendUnique)' -v -timeout=3m

  targeted-test:
    name: Targeted test (${{ matrix.os }} / ${{ matrix.shard }} / partition ${{ matrix.partition }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [core, core-b, platform-integration, state-perf, ubuntu-stress, windows-skills-desktop, windows-skills-desktop-b, windows-codex-e2e]
        partition: [0]
        exclude:
          - os: macos-latest
            shard: ubuntu-stress
          - os: windows-latest
            shard: ubuntu-stress
          - os: ubuntu-latest
            shard: windows-skills-desktop
          - os: ubuntu-latest
            shard: windows-skills-desktop-b
          - os: ubuntu-latest
            shard: windows-codex-e2e
          - os: macos-latest
            shard: windows-skills-desktop
          - os: macos-latest
            shard: windows-skills-desktop-b
          - os: macos-latest
            shard: windows-codex-e2e
        # The state/performance shard contains a long, independent sequence of
        # helper state directory migration processes.  Keep the normal targeted
        # matrix intact and add only a second state/perf runner for that
        # sequence; the other state/perf checks remain single-runner tests.
        include:
          - os: ubuntu-latest
            shard: state-perf
            partition: 1
          - os: macos-latest
            shard: state-perf
            partition: 1
          - os: windows-latest
            shard: state-perf
            partition: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Workflow lint (Linux only)
        if: matrix.shard == 'core' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 -color

      - name: Forbid external account credentials in repository CI (Linux only)
        if: matrix.shard == 'core' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          scan_workflows() {
            local scan_status=0
            grep "$@" .github/workflows || scan_status=$?
            if [ "$scan_status" -gt 1 ]; then
              exit "$scan_status"
            fi
            return "$scan_status"
          }
          if scan_workflows -RnE '\$\{\{[[:space:]]*secrets\.'; then
            echo "Repository CI must not read GitHub Actions secrets; use github.token only for repository-scoped release writes." >&2
            exit 1
          fi
          credential_names=(
            "CODEX_LIVE_AUTH""_JSON"
            "CXP_LIVE_NVIDIA_API""_KEY"
            "CXP_LIVE_HTTP""_PROXY"
            "TEAMS_TOKEN_CACHE""_JSON"
            "FILE_WRITE_TOKEN_CACHE""_JSON"
          )
          for credential_name in "${credential_names[@]}"; do
            if scan_workflows -RnF -- "$credential_name"; then
              echo "Repository CI must not define external OpenAI, NVIDIA, proxy, or Teams credential input: $credential_name" >&2
              exit 1
            fi
          done

      - name: Check CI helper scripts (Linux only)
        if: matrix.shard == 'core' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts/ci -name '*.sh' -print0)

      - name: Script unit tests (Linux/macOS)
        if: matrix.shard == 'core' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Patched-binary cleanup real HOME safety (Linux only)
        if: matrix.shard == 'core' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/tests/run_cleanup_patched_binaries_docker.sh

      - name: Install PATH activation matrix (Linux only)
        if: matrix.shard == 'platform-integration' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo bash scripts/ci/apt_update.sh
          sudo env DEBIAN_FRONTEND=noninteractive bash scripts/ci/retry.sh 5 5 apt-get install -y --no-install-recommends zsh fish csh tcsh
          CODEX_PROXY_REQUIRE_SHELL_MATRIX=1 bash scripts/ci/install_path_activation_matrix.sh

      - name: Install PATH activation matrix (macOS only)
        if: matrix.shard == 'platform-integration' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v fish >/dev/null 2>&1 || ! command -v nu >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              if HOMEBREW_NO_AUTO_UPDATE=1 brew install fish nushell; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                exit 1
              fi
              sleep $((attempt * 10))
            done
          fi
          CODEX_PROXY_REQUIRE_SHELL_MATRIX=1 bash scripts/ci/install_path_activation_matrix.sh

      - name: Teams account-default PATH through real shells (Linux/macOS)
        if: matrix.shard == 'platform-integration' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Exercise only shells deliberately installed/prepared by the
          # platform matrix. Ubuntu images may contain pwsh, but PowerShell's
          # Unix -Login startup can hang in the hosted non-interactive runner;
          # its adapter/protocol contracts remain covered by focused tests.
          required_shells='sh bash zsh fish csh tcsh'
          if [ "$RUNNER_OS" = macOS ]; then
            required_shells="$required_shells nu"
          fi
          CODEX_HELPER_USER_PATH_LIVE=1 \
            CODEX_HELPER_USER_PATH_LIVE_SHELLS="$required_shells" \
            go test ./internal/userpath -count=1 -run '^TestAccountDefaultLiveShellMatrix$' -v

      - name: Teams auth bootstrap dry-run (Linux/macOS)
        if: matrix.shard == 'core' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest scripts/tests/test_teams_auth_bootstrap_scripts.py

      - name: Script unit tests (Windows)
        if: matrix.shard == 'core' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          py -3 -m unittest discover -s scripts/tests -p "test_*.py"

      - name: Check CI PowerShell scripts (Windows)
        if: matrix.shard == 'core' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Get-ChildItem -LiteralPath scripts\ci -Filter *.ps1 | ForEach-Object {
            $null = [scriptblock]::Create((Get-Content -Raw -LiteralPath $_.FullName))
          }

      - name: Teams auth bootstrap dry-run (Windows)
        if: matrix.shard == 'core' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          py -3 -m unittest scripts/tests/test_teams_auth_bootstrap_scripts.py

      - name: gofmt (verify)
        if: matrix.shard == 'core'
        shell: bash
        run: |
          bad="$(gofmt -l .)"
          if [ -n "$bad" ]; then
            echo "gofmt required for:"
            echo "$bad"
            exit 1
          fi

      - name: CXP TUI preview, navigation, refresh, and thread-name regressions
        if: matrix.shard == 'core-b'
        shell: bash
        run: |
          set -euo pipefail
          history_pattern='Test(ReadSessionPreviewMessages(DeduplicatesMirroredCodexEvents|DeduplicatesMirrorsWithDifferentSourceKinds|DeduplicatesMirroredUserAndStripsTeamsEnvelope|CleansEventOnlyUserPrompt|KeepsDistinctSameSourceIDsWithSameText|KeepsDistinctRepeatedUserPrompts|KeepsIdenticalCommentaryAndFinal|LimitCountsMirroredUserOnce)|ReadSessionPreviewText(AppendDeduplicatesMirroredMessage|ColdCacheRetainsSkippedMirrorSourceID)|ParseMessagePayload_PreservesTeamsHelperEnvelope|FirstPromptTitleText(StripsLastTeamsHelperSuffix|PreservesLeadingQuotedMarkerBeforeOuterSuffix)|ProcessMetaLine_SubagentFields|DiscoverProjects_SubagentAssociation|FlattenSessionGraphKeepsForkLineageSeparateFromSubagentClassification)$'
          history_tui_pattern='^Test(HistoryTuiPathUnderExcludedRoot|FilterHistoryTuiProjects|LoadHistoryTuiProjectsFiltersDiscoveredTempProjects|HistoryListCmdListsForkAsTopLevelSession)$'
          tui_pattern='Test(IsPreviewNavKey|ApplyPreviewNavigation|PreviewArrowKeysScrollWhenFocused|RefreshState(UpdatesOrPreserves|PreservesSelectionIdentityAcrossListChanges)|SelectionIdentityLookupDoesNotAllocate|SelectSessionAutoRefreshPreservesSelection|HandleKeyEnterOpensTopLevelForkSession)$'
          go test ./internal/codexhistory -count=1 -run "$history_pattern" -v
          go test ./internal/cli -count=1 -run "$history_tui_pattern" -v
          go test ./internal/tui -count=1 -run "$tui_pattern" -v
          go test ./internal/tui -run '^$' -bench '^BenchmarkResolveSelectionForDrawLargeHistory$' -benchtime=10x -count=1 -benchmem
          thread_name_history_pattern='^Test(ReadThreadNameIndexUsesLatestValidName|LoadThreadNameIndex(CachesUntilFileChanges|IsOptionalMetadata)|DiscoverProjects(AndFindSessionUseThreadNameIndex|PreservesPromptWithoutValidThreadName|RefreshesThreadNameWhenIndexChanges)|SessionThreadNameJSONIsBackwardCompatibleWhenEmpty)$'
          go test ./internal/codexhistory -count=1 -run "$thread_name_history_pattern" -v
          go test ./internal/tui -count=1 -run '^Test(BuildSessionItemsUsesCodexThreadName|SelectSessionAutoRefreshUpdatesThreadNameTitle)$' -v
          go test ./internal/cli -count=1 -run '^TestHistoryListCmdTracksCodexThreadNameIndex$' -v
          go test ./internal/codexhistory -run '^$' -bench '^BenchmarkLoadThreadNameIndexCached$' -benchtime=100x -count=1 -benchmem

      - name: go mod tidy (verify)
        if: matrix.shard == 'core'
        shell: bash
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "go.mod/go.sum not tidy"
            git diff go.mod go.sum
            exit 1
          fi

      - name: Native Codex fork contract regressions
        if: matrix.shard == 'core'
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/codexrunner -count=1 -run '^Test(AppServerLaunchContext|AppServerRunnerForkThread)' -v
          go test ./internal/cli -count=1 -run '^Test(Run(CodexForkSession|HistoryTuiForksOnlyValidatedMainSelection)|TeamsCodexExecutorReconcileForkThread)' -v
          go test ./internal/tui -count=1 -run '^TestHandleKeyForksOnlyMainSession$' -v

      - name: Managed install convergence regressions
        if: matrix.shard == 'platform-integration'
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/managedinstall -count=1 -v
          go test ./internal/update -count=1 -run 'TestResolveInstallPath(UsesExactEnvInstallPathBeforeLegacyDir|MapsEnvCXPShimToManagedSibling|MapsCurrentCXPEntrypointToManagedSibling)$' -v
          go test ./internal/cli -count=1 -run '^TestLegacyUpdater' -v
          go test ./internal/cli -count=1 -run '^TestFinalizeHelperUpdateResult(AcceptsOlderStableDispatcher|RejectsUnrunnableStableDispatcher|RejectsStableDispatcherThatReactivatesOlderRuntime)$' -v
          go test ./internal/cli -count=1 -run 'Test(UpgradeCmdUsesManagedDefaultWhenLaunchedAsCXP|FinalizeHelperEntrypoints(RepairsAndVerifiesCXPEntrypointVersion|FailsWhenCXPEntrypointCannotBeVerified|MigratesCXPRecordTargetToManagedBinary|PreservesLogicalRecordThroughSymlinkedLocal)|ReplaceSymlinkAtomicallyRejectsTargetChainThroughLinkPath|CurrentHelperInstallCandidatesTreatCXPAsShimOnly|RewriteLegacyCXPProfile.*|EnsureCXPShimForInstallPath(RepairsStalePOSIXSymlink|CreatesWindowsCmdShim|RepairsWindowsCmdShim|NormalizesManagedWindowsCmdShim|KeepsNonHelperWindowsCmd)|TeamsReleaseAutoUpdaterApply(UsesRunningGoBinAndUnifiesManagedDefault|PrefersLogicalDefaultThroughSymlinkedLocal|RepairsSelfLoopedManagedTargetThroughSymlinkedLocal|IgnoresUnusableSelfLoopedEnvWhenCurrentExecutableIsRunnable)|Teams(ServiceInstall(UsesManagedDefaultInsteadOfGoBinExecutable|MaterializesManagedDefaultBeforeRepointingFromGoBin|SkipsMaterializingSameTargetThroughSymlinkedLocal|CreatesMissingManagedDefaultBeforeRepointingFromGoBin|DoesNotTreatBlockedManagedDefaultAsInstallDir|RepairsCorruptManagedDefaultBeforeRepointingFromGoBin)|ServiceBootstrapDryRunDoesNotWriteOrStart))$' -v
          go test . -count=1 -run 'TestInstall(Sh|Ps1)KeepsPathSetupWhenInstallDirAlreadySet$|TestInstallPs1(ChecksumDownloadRemainsBestEffort|UsesUniqueTemporaryPathsAndCleansThemOnFailure)$' -v

      - name: Windows installer checksum and concurrency regressions
        if: matrix.shard == 'platform-integration' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          go test . -count=1 -run 'TestInstallPs1(ChecksumMismatchFailsBeforeReplacingBinaries|ChecksumWithoutTargetAssetRowRemainsBestEffort|ConcurrentDownloadsUseIsolatedTemporaryPaths)$' -v

      - name: CXP immutable runtime and process identity
        if: matrix.shard == 'platform-integration'
        shell: bash
        run: |
          set -euo pipefail
          go test ./cmd/codex-proxy -count=1 -run 'TestRunMain(HandlesCandidateUpdateBeforeRuntimeDispatch|RunsLegacyPreflightBeforeRuntimeDispatch|PreflightFailureStopsBeforeRuntimeDispatch)$' -v
