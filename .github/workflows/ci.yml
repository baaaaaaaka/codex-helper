name: CI

# The pull-request tier: everything here must finish in under 10 minutes of
# wall time. It runs the whole unit suite on Linux, Windows and macOS, the
# core and channel packages under -race, the complete black-box E2E suite
# (sharded by package), and the static checks. Soak and stress runs, fault
# labs, the whole-repository race sweep, the Linux-distro matrix, live
# installers and services, and the installed-Codex contracts run in
# nightly.yml (every night, on demand, and before every release).
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A pull request can otherwise leave several generations of the same expensive
# matrix running at once. Canceling superseded revisions keeps hosted runners
# available for the current commit and removes stale callbacks from the CI
# signal that reviewers use to make a decision.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and script checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: gofmt (verify)
        shell: bash
        run: |
          bad="$(gofmt -l .)"
          if [ -n "$bad" ]; then
            echo "gofmt required for:"
            echo "$bad"
            exit 1
          fi

      - name: go mod tidy (verify)
        shell: bash
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "go.mod/go.sum not tidy"
            git diff go.mod go.sum
            exit 1
          fi

      - name: Workflow lint
        shell: bash
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 -color

      - name: Forbid external account credentials in repository CI
        shell: bash
        run: |
          set -euo pipefail
          scan_workflows() {
            local scan_status=0
            grep "$@" .github/workflows || scan_status=$?
            if [ "$scan_status" -gt 1 ]; then
              exit "$scan_status"
            fi
            return "$scan_status"
          }
          if scan_workflows -RnE '\$\{\{[[:space:]]*secrets\.'; then
            echo "Repository CI must not read GitHub Actions secrets; use github.token only for repository-scoped release writes." >&2
            exit 1
          fi
          credential_names=(
            "CODEX_LIVE_AUTH""_JSON"
            "CXP_LIVE_NVIDIA_API""_KEY"
            "CXP_LIVE_HTTP""_PROXY"
            "TEAMS_TOKEN_CACHE""_JSON"
            "FILE_WRITE_TOKEN_CACHE""_JSON"
          )
          for credential_name in "${credential_names[@]}"; do
            if scan_workflows -RnF -- "$credential_name"; then
              echo "Repository CI must not define external OpenAI, NVIDIA, proxy, or Teams credential input: $credential_name" >&2
              exit 1
            fi
          done

      - name: Check CI helper scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts/ci -name '*.sh' -print0)

      - name: Check CI PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          # A parse check only; the scripts run on Windows in nightly.yml.
          Get-ChildItem -LiteralPath scripts/ci -Filter *.ps1 | ForEach-Object {
            $null = [scriptblock]::Create((Get-Content -Raw -LiteralPath $_.FullName))
          }

      - name: Script unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  shared-codex-contract:
    name: Shared Codex protocol probes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned protocol target
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/shared-codex" --include=optional @openai/codex@0.166.0
      - name: Probe native multi-client and queue semantics offline
        shell: bash
        run: |
          set -euo pipefail
          native="$(find "$RUNNER_TEMP/shared-codex/node_modules" -type f -path '*/vendor/*/bin/codex' -print -quit)"
          test -n "$native"
          bash scripts/ci/run_shared_codex_contracts.sh "$native" 2>&1 | tee "$RUNNER_TEMP/shared-codex-contract.log"
      - name: Upload protocol evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: shared-codex-protocol-evidence
          path: ${{ runner.temp }}/shared-codex-contract.log
          if-no-files-found: ignore

  cross-build:
    name: Cross-OS vet and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: go vet (Linux, Windows, macOS)
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          # The black-box E2E tree (internal/e2e) drives the helper with Unix
          # signals and runs only on Linux; every other package, tests
          # included, must type-check for Windows and macOS.
          for goos in windows darwin; do
            mapfile -t packages < <(GOOS="$goos" go list ./... | grep -v '/internal/e2e/')
            GOOS="$goos" go vet "${packages[@]}"
          done

      - name: Cross-compile check
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(go list -f '{{if .GoFiles}}{{.ImportPath}}{{end}}' ./... | grep -v '/internal/e2e/')
          GOOS=darwin  GOARCH=arm64 go build "${packages[@]}"
          GOOS=darwin  GOARCH=amd64 go build "${packages[@]}"
          GOOS=windows GOARCH=amd64 go build "${packages[@]}"
          GOOS=linux   GOARCH=arm64 go build ./...

  unit-linux:
    name: Unit tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Teams startup ownership regression gate
        shell: bash
        run: bash scripts/ci/test_teams_startup_recovery.sh unit

      - name: go test (with coverage)
        shell: bash
        run: |
          bash scripts/ci/run_linux_full_go_test_collect.sh

      - name: Upload full-suite diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: full-go-test-diagnostics-ubuntu-latest
          path: |
            ${{ runner.temp }}/full-go-test*.log
            ${{ runner.temp }}/migration-process-isolated.log
          if-no-files-found: ignore

      - name: Coverage gate
        shell: bash
        run: |
          threshold="40.0"
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$NF); print $NF}')"
          echo "Total coverage: ${total}% (threshold ${threshold}%)"
          awk -v total="$total" -v threshold="$threshold" 'BEGIN { if (total+0 < threshold+0) { printf("coverage %.2f%% < %.2f%%\n", total, threshold); exit 1 } }'

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      - name: Teams test user-directory isolation guard
        shell: bash
        run: bash scripts/tests/check_teams_test_user_dir_isolation.sh

      - name: Teams runtime safety test isolation
        shell: bash
        run: bash scripts/tests/run_teams_runtime_safety_shard.sh isolation

  race-core:
    name: Race test (core and channel)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Core and channel race with leak checks
        shell: bash
        run: |
          set -o pipefail
          # The core packages check for leaked goroutines when their tests
          # end; run them as a whole so that check sees every test. The
          # whole-repository race sweep runs in nightly.yml.
          go test -race -count=1 -timeout=15m -parallel=16 ./internal/core/... ./internal/channel/... 2>&1 | tee "$RUNNER_TEMP/race-core.log"

      - name: Teams startup and watchdog race checks
        shell: bash
        run: |
          set -euo pipefail
          go test -race -count=1 -timeout=5m ./internal/cli -run '^Test(TeamsCoreStore|FirstStart|TeamsServiceWatchdog|RunTeamsServiceWatchdog)' 2>&1 | tee "$RUNNER_TEMP/race-teams-startup.log"

      - name: Upload race diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: race-core-diagnostics
          path: |
            ${{ runner.temp }}/race-core.log
            ${{ runner.temp }}/race-teams-startup.log
          if-no-files-found: ignore

  e2e:
    name: End-to-end scenarios (shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Whole scenario packages are packed onto the shards by
        # scripts/ci/e2e_shards.py from `go list`, so a new scenario package
        # joins a shard without a workflow change.
        shard: [0, 1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Repeat Teams migration and watchdog recovery contracts
        if: matrix.shard == 0
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          bash scripts/ci/test_teams_startup_recovery.sh e2e 2>&1 | tee "$RUNNER_TEMP/startup-recovery-e2e.log"

      - name: Scenarios through the production entry point
        shell: bash
        env:
          E2E_SUT: cxp
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python3 scripts/ci/e2e_shards.py --count 3 --plan
          mapfile -t packages < <(python3 scripts/ci/e2e_shards.py --count 3 --index "${{ matrix.shard }}")
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "shard ${{ matrix.shard }} has no scenario package"
            exit 0
          fi
          # The scenarios drive `cxp teams run` against a fake Graph service
          # and a fake Codex app-server; nothing leaves the runner. They wait
          # on the helper's timers far more than they use CPU, so 8 run at
          # once per package on the 4-CPU runner (per-test times measured
          # unchanged from -parallel=4; see scripts/ci/e2e_shard_weights.json).
          go test -count=1 -parallel=8 -timeout=600s "${packages[@]}" 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      - name: Upload e2e diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/e2e.log
            ${{ runner.temp }}/startup-recovery-e2e.log
          if-no-files-found: ignore

  unit-windows-macos:
    name: Unit tests (${{ matrix.os }} / partition ${{ matrix.partition }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        partition: [0, 1]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Teams startup ownership regression gate (native OS)
        if: matrix.partition == 0
        shell: bash
        run: bash scripts/ci/test_teams_startup_recovery.sh unit

      - name: go test
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/full-go-test.log"
          # Every discovered Test/Example/Fuzz entry runs exactly once across
          # the two partitions, in bounded prefix shards. The E2E scenarios
          # run in the Linux e2e job; on Windows the whole E2E tree is left
          # out, since its harness drives the helper with Unix signals.
          exclude=(-exclude-prefix=github.com/baaaaaaaka/codex-helper/internal/e2e/scenarios/)
          if [ "$RUNNER_OS" = "Windows" ]; then
            exclude=(-exclude-prefix=github.com/baaaaaaaka/codex-helper/internal/e2e/)
          fi
          if ! go run ./scripts/ci/run_full_go_test_shards.go -timeout=20m -parallel=16 -shards=16 -partition-count=2 -partition-index="${{ matrix.partition }}" "${exclude[@]}" 2>&1 | tee "$log"; then
            summary="$(grep -E -A8 '^--- FAIL:|^FAIL[[:space:]]|^panic:|^fatal error:' "$log" | tail -80 | tr '\n' ' ' || true)"
            if ! grep -Eq '^--- FAIL:|^panic:|^fatal error:' "$log"; then
              summary="$(tail -40 "$log" | tr '\n' ' ')"
            fi
            echo "::error title=Full Go test failure::${summary:-go test failed without a recognized summary; inspect the retained step log}"
            # Keep the original shard failure authoritative; reproduce that
            # exact package/test and mode separately when investigating it.
            exit 1
          fi

      - name: Teams test user-directory isolation guard (Windows)
        if: runner.os == 'Windows' && matrix.partition == 0
        shell: pwsh
        run: |
          .\scripts\tests\check_teams_test_user_dir_isolation.ps1

      - name: Upload full-suite diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: full-go-test-diagnostics-${{ matrix.os }}-${{ matrix.partition }}
          path: ${{ runner.temp }}/full-go-test*.log
          if-no-files-found: ignore

  test:
    name: Test
    runs-on: ubuntu-latest
    needs:
      - lint
      - cross-build
      - unit-linux
      - race-core
      - shared-codex-contract
      - e2e
      - unit-windows-macos
    if: ${{ always() }}

    steps:
      - name: Verify parallel CI shards
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          check() {
            name="$1"
            result="$2"
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              failures=$((failures + 1))
            fi
          }
          check lint "${{ needs.lint.result }}"
          check cross-build "${{ needs.cross-build.result }}"
          check unit-linux "${{ needs.unit-linux.result }}"
          check race-core "${{ needs.race-core.result }}"
          check shared-codex-contract "${{ needs.shared-codex-contract.result }}"
          check e2e "${{ needs.e2e.result }}"
          check unit-windows-macos "${{ needs.unit-windows-macos.result }}"
          if [ "$failures" -ne 0 ]; then
            echo "$failures CI shard(s) failed or did not run"
            exit 1
          fi
