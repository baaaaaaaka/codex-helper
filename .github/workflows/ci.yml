          $env:CODEX_HELPER_TEAMS_READ_CLIENT_ID = "ci-read-client"
          $env:CODEX_HELPER_TEAMS_FULL_CLIENT_ID = "ci-full-client"
          $env:CODEX_HELPER_TEAMS_FILE_WRITE_CLIENT_ID = "ci-file-client"
          $env:CODEX_HELPER_TEAMS_TOKEN_CACHE = Join-Path $env:RUNNER_TEMP "teams-appserver-token.json"
          $env:CODEX_HELPER_TEAMS_READ_TOKEN_CACHE = Join-Path $env:RUNNER_TEMP "teams-appserver-read-token.json"
          $env:CODEX_HELPER_TEAMS_FULL_TOKEN_CACHE = Join-Path $env:RUNNER_TEMP "teams-appserver-full-token.json"
          $env:CODEX_HELPER_TEAMS_FILE_WRITE_TOKEN_CACHE = Join-Path $env:RUNNER_TEMP "teams-appserver-file-token.json"
          go run ./cmd/codex-proxy teams doctor --appserver-probe --codex-path $codexCommand.Source --workdir $env:RUNNER_TEMP --probe-timeout 20s --appserver-probe-runs 2

      - name: Codex upgrade integration (system npm, Linux/macOS)
        if: matrix.shard == 'platform-integration' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          retire_path() {
            # shellcheck disable=SC2016
            node -e 'const crypto=require("crypto"); const path=require("path"); const p=process.argv[1]; const hash=crypto.createHash("sha1").update(p).digest("base64").replace(/[^a-zA-Z0-9]+/g, "").slice(0, 8); console.log(path.resolve(path.dirname(p), `.${path.basename(p)}-${hash}`));' "$1"
          }
          seed_stale_codex_backup() {
            local prefix="$1"
            local pkg_dir="$prefix/lib/node_modules/@openai/codex"
            local pkg_retired
            pkg_retired="$(retire_path "$pkg_dir")"
            mkdir -p "$pkg_retired"
            echo stale > "$pkg_retired/README.md"
            local bin_retired
            bin_retired="$(retire_path "$prefix/bin/codex")"
            echo stale > "$bin_retired"
          }
          bash scripts/ci/retry.sh 5 5 npm install -g --include=optional @openai/codex
          system_prefix="$(npm prefix -g)"
          system_codex_path="$(command -v codex)"
          seed_stale_codex_backup "$system_prefix"
          go run ./cmd/codex-proxy --config "$RUNNER_TEMP/codex-upgrade-system.json" --upgrade-codex --upgrade-codex-path "$system_codex_path"
          codex --version >/dev/null
          upgraded_path="$(command -v codex)"
          case "$upgraded_path" in
            "$system_prefix"/*) ;;
            *)
              echo "expected system npm codex under $system_prefix, got $upgraded_path"
              exit 1
              ;;
          esac

      - name: Codex upgrade integration (managed npm with unrelated PATH Codex, Linux/macOS)
        if: matrix.shard == 'platform-integration' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          retire_path() {
            # shellcheck disable=SC2016
            node -e 'const crypto=require("crypto"); const path=require("path"); const p=process.argv[1]; const hash=crypto.createHash("sha1").update(p).digest("base64").replace(/[^a-zA-Z0-9]+/g, "").slice(0, 8); console.log(path.resolve(path.dirname(p), `.${path.basename(p)}-${hash}`));' "$1"
          }
          seed_stale_codex_backup() {
            local prefix="$1"
            local pkg_dir="$prefix/lib/node_modules/@openai/codex"
            local pkg_retired
            pkg_retired="$(retire_path "$pkg_dir")"
            mkdir -p "$pkg_retired"
            echo stale > "$pkg_retired/README.md"
            local bin_retired
            bin_retired="$(retire_path "$prefix/bin/codex")"
            echo stale > "$bin_retired"
          }
          local_prefix="$RUNNER_TEMP/codex-local-prefix"
          bash scripts/ci/retry.sh 5 5 npm install -g --prefix "$local_prefix" --include=optional @openai/codex
          path_codex_before="$(command -v codex)"
          export CODEX_NPM_PREFIX="$local_prefix"
          seed_stale_codex_backup "$local_prefix"
          go run ./cmd/codex-proxy --config "$RUNNER_TEMP/codex-upgrade-local.json" --upgrade-codex
          "$local_prefix/bin/codex" --version >/dev/null
          path_codex_after="$(command -v codex)"
          if [ "$path_codex_after" != "$path_codex_before" ]; then
            echo "default managed upgrade changed PATH-selected Codex from $path_codex_before to $path_codex_after"
            exit 1
          fi

      - name: Codex upgrade integration (system npm, Windows)
        if: matrix.shard == 'windows-codex-e2e' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          function Get-RetirePath([string]$PathValue) {
            $sha1 = [System.Security.Cryptography.SHA1]::Create()
            try {
              $hashBytes = $sha1.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($PathValue))
            } finally {
              $sha1.Dispose()
            }
            $base64 = [Convert]::ToBase64String($hashBytes)
            $slug = -join ($base64.ToCharArray() | Where-Object { [char]::IsLetterOrDigit($_) })
            if ($slug.Length -gt 8) {
              $slug = $slug.Substring(0, 8)
            }
            Join-Path (Split-Path -Parent $PathValue) ('.' + (Split-Path -Leaf $PathValue) + '-' + $slug)
          }
          function New-StaleCodexBackup([string]$Prefix) {
            $pkgDir = Join-Path $Prefix "node_modules\@openai\codex"
            $pkgRetired = Get-RetirePath $pkgDir
            New-Item -ItemType Directory -Force -Path $pkgRetired | Out-Null
            Set-Content -Path (Join-Path $pkgRetired "README.md") -Value "stale"
            $ps1Retired = Get-RetirePath (Join-Path $Prefix "codex.ps1")
            Set-Content -Path $ps1Retired -Value "stale"
          }
          & .\scripts\ci\retry.ps1 5 5 npm install -g --include=optional '@openai/codex'
          $systemPrefix = (npm prefix -g).Trim()
          $systemCodexPath = Join-Path $systemPrefix "codex.cmd"
          if (-not (Test-Path -LiteralPath $systemCodexPath)) {
            throw "expected npm Codex command shim at $systemCodexPath"
          }
          New-StaleCodexBackup $systemPrefix
          go run ./cmd/codex-proxy --config "$env:RUNNER_TEMP\codex-upgrade-system.json" --upgrade-codex --upgrade-codex-path $systemCodexPath
          & codex --version | Out-Null
          $upgradedPath = (Get-Command codex).Source
          if (-not $upgradedPath.ToLower().StartsWith($systemPrefix.ToLower())) {
            throw "expected system npm codex under $systemPrefix, got $upgradedPath"
          }

      - name: Codex upgrade integration (managed npm with unrelated PATH Codex, Windows)
        if: matrix.shard == 'windows-codex-e2e' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          function Get-RetirePath([string]$PathValue) {
            $sha1 = [System.Security.Cryptography.SHA1]::Create()
            try {
              $hashBytes = $sha1.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($PathValue))
            } finally {
              $sha1.Dispose()
            }
            $base64 = [Convert]::ToBase64String($hashBytes)
            $slug = -join ($base64.ToCharArray() | Where-Object { [char]::IsLetterOrDigit($_) })
            if ($slug.Length -gt 8) {
              $slug = $slug.Substring(0, 8)
            }
            Join-Path (Split-Path -Parent $PathValue) ('.' + (Split-Path -Leaf $PathValue) + '-' + $slug)
          }
          function New-StaleCodexBackup([string]$Prefix) {
            $pkgDir = Join-Path $Prefix "node_modules\@openai\codex"
            $pkgRetired = Get-RetirePath $pkgDir
            New-Item -ItemType Directory -Force -Path $pkgRetired | Out-Null
            Set-Content -Path (Join-Path $pkgRetired "README.md") -Value "stale"
            $ps1Retired = Get-RetirePath (Join-Path $Prefix "codex.ps1")
            Set-Content -Path $ps1Retired -Value "stale"
          }
          $localPrefix = Join-Path $env:RUNNER_TEMP "codex-local-prefix"
          & .\scripts\ci\retry.ps1 5 5 npm install -g --prefix $localPrefix --include=optional '@openai/codex'
          $pathCodexBefore = (Get-Command codex).Source
          $env:CODEX_NPM_PREFIX = $localPrefix
          New-StaleCodexBackup $localPrefix
          go run ./cmd/codex-proxy --config "$env:RUNNER_TEMP\codex-upgrade-local.json" --upgrade-codex
          $managedCodexPath = Join-Path $localPrefix "codex.cmd"
          & $managedCodexPath --version | Out-Null
          $pathCodexAfter = (Get-Command codex).Source
          if ($pathCodexAfter -ne $pathCodexBefore) {
            throw "default managed upgrade changed PATH-selected Codex from $pathCodexBefore to $pathCodexAfter"
          }

      - name: Codex approval, history, and cancellation runtime integration (Linux/macOS)
        if: matrix.shard == 'platform-integration' && runner.os != 'Windows'
        shell: bash
        env:
          CODEX_REMOTE_TUI_CONTRACT_TEST: "1"
          CODEX_RUNTIME_CONTRACT_TEST: "1"
          CODEX_RUNTIME_TEST: "1"
          CODEX_RUNTIME_E2E_TEST: "1"
        run: |
          set -euo pipefail
          command -v codex >/dev/null
          go test ./internal/codexcontract -run 'TestInstalledCodex(RuntimeContract|RemoteTUI.*Handshake)' -count=1 -v
          go test ./internal/cli -run 'Test(ProbeCodexIntegration|InstalledCodexRuntimeMigrationDefersLivePrivateArtifacts)' -count=1 -v
          go test ./internal/responsespolicy -run TestServerRoutesResponsesAndLeavesNonResponsesTrafficUnchanged -count=1 -v
          go test ./internal/codexrunner -run 'Test(InstalledCodex(StandardApproval|MetadataOnlyResume|ExplicitCancelInterrupt)Runtime|PolicyStarterPreservesUserChatGPTOriginAndAddsOnlyResponsesGateway|AppServerRunner(PreservesBoundedCloudConfigErrorData|DefaultApprovalModeFailsClosed|AutomaticApprovalModeIsExplicit)|AutomaticApprovalResultMatrix|RemoteBrokerManualModeRelaysApprovalRequestsAndResponsesByteTransparent)' -count=1 -v

      - name: Codex approval, history, and cancellation runtime integration (Windows)
        if: matrix.shard == 'windows-codex-e2e' && runner.os == 'Windows'
        shell: pwsh
        env:
          CODEX_REMOTE_TUI_CONTRACT_TEST: "1"
          CODEX_RUNTIME_CONTRACT_TEST: "1"
          CODEX_RUNTIME_TEST: "1"
          CODEX_RUNTIME_E2E_TEST: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $null = Get-Command codex -ErrorAction Stop
          go test ./internal/codexcontract -run 'TestInstalledCodex(RuntimeContract|RemoteTUI.*Handshake)' -count=1 -v
          go test ./internal/cli -run 'Test(ProbeCodexIntegration|InstalledCodexRuntimeMigrationDefersLivePrivateArtifacts)' -count=1 -v
          go test ./internal/responsespolicy -run TestServerRoutesResponsesAndLeavesNonResponsesTrafficUnchanged -count=1 -v
          go test ./internal/codexrunner -run 'Test(InstalledCodex(StandardApproval|MetadataOnlyResume|ExplicitCancelInterrupt)Runtime|PolicyStarterPreservesUserChatGPTOriginAndAddsOnlyResponsesGateway|AppServerRunner(PreservesBoundedCloudConfigErrorData|DefaultApprovalModeFailsClosed|AutomaticApprovalModeIsExplicit)|AutomaticApprovalResultMatrix|RemoteBrokerManualModeRelaysApprovalRequestsAndResponsesByteTransparent)' -count=1 -v

      - name: Managed-node install integration (Linux/macOS)
        if: matrix.shard == 'platform-integration' && runner.os != 'Windows'
        shell: bash
        env:
          CODEX_INSTALL_TEST: "1"
        run: |
          set -euo pipefail
          go test ./internal/cli -run TestEnsureCodexInstalledIntegrationManagedNode -count=1 -v

      - name: Native managed-node install integration (Windows)
        if: matrix.shard == 'windows-codex-e2e' && runner.os == 'Windows'
        shell: pwsh
        env:
          CODEX_INSTALL_TEST: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          go test ./internal/cli -run TestEnsureCodexInstalledIntegrationManagedNode -count=1 -v

  codex-runtime-contract:
    name: Codex runtime contract (${{ matrix.os }} / ${{ matrix.codex-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        codex-version: ["0.131.0", "latest"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install exact Codex version (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CODEX_VERSION: ${{ matrix.codex-version }}
        run: |
          set -euo pipefail
          bash scripts/ci/retry.sh 5 5 npm install -g --include=optional "@openai/codex@${CODEX_VERSION}"
          command -v codex >/dev/null
          codex --version
          codex app-server --help >/dev/null

      - name: Install exact Codex version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CODEX_VERSION: ${{ matrix.codex-version }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          & .\scripts\ci\retry.ps1 5 5 npm install -g --include=optional "@openai/codex@$env:CODEX_VERSION"
          $null = Get-Command codex -ErrorAction Stop
          & codex --version
          & codex app-server --help *> $null
          if ($LASTEXITCODE -ne 0) { throw "Codex app-server probe failed with exit code $LASTEXITCODE" }
          $winpty = Get-Command winpty -ErrorAction SilentlyContinue
          if ($null -eq $winpty) {
            $bundledWinpty = Join-Path $env:ProgramFiles "Git\usr\bin\winpty.exe"
            if (-not (Test-Path -LiteralPath $bundledWinpty)) {
              throw "winpty is required for the Windows remote TUI contract"
            }
            Add-Content -LiteralPath $env:GITHUB_PATH -Value (Split-Path -Parent $bundledWinpty)
          }

      - name: Run original-binary approval, history, and cancellation contracts
        shell: bash
        env:
          CODEX_REMOTE_TUI_CONTRACT_TEST: "1"
          CODEX_RUNTIME_CONTRACT_TEST: "1"
          CODEX_RUNTIME_TEST: "1"
          CODEX_RUNTIME_E2E_TEST: "1"
          CODEX_HELPER_LIVE_CODEX_MODEL_CATALOG: "1"
          CODEX_HELPER_SYNTHETIC_TEAMS_MODEL_SWITCH: "1"
        run: |
          set -euo pipefail
          command -v codex >/dev/null
          go test ./internal/codexcontract -run 'TestInstalledCodex(RuntimeContract|RemoteTUI.*Handshake)' -count=1 -v
          go test ./internal/cli -run 'Test(ProbeCodexIntegration|InstalledCodexRuntimeMigrationDefersLivePrivateArtifacts)' -count=1 -v
          go test ./internal/responsespolicy -run TestServerRoutesResponsesAndLeavesNonResponsesTrafficUnchanged -count=1 -v
          go test ./internal/codexrunner -run 'Test(InstalledCodex(StandardApproval|MetadataOnlyResume|ExplicitCancelInterrupt)Runtime|PolicyStarterPreservesUserChatGPTOriginAndAddsOnlyResponsesGateway|AppServerRunner(PreservesBoundedCloudConfigErrorData|DefaultApprovalModeFailsClosed|AutomaticApprovalModeIsExplicit)|AutomaticApprovalResultMatrix|RemoteBrokerManualModeRelaysApprovalRequestsAndResponsesByteTransparent)' -count=1 -v
          printf '%s\n' \
            '{"schema":3,"os":"${{ matrix.os }}","codex_version":"${{ matrix.codex-version }}","authentication":"synthetic-chatgpt","external_account_credentials":false,"official_binary":true,"default_responses_websocket":true,"analytics_enabled":true,"contracts":["app-server-schema","per-turn-model","per-turn-reasoning-effort","metadata-only-resume","explicit-cancel-interrupt","same-thread-resume-after-cancel","turn-summary-final-integrity","resume-context-preserved","thread-rename-history-index","remote-tui-pty","production-remote-broker-bearer","manual-approval-byte-transparent","manual-headless-fail-closed","aaa-explicit","cli-probe","standard-user-approval","approval-request-matrix","analytics-user-approved","responses-websocket","responses-only-proxy-routing","chatgpt-origin-preserved","structured-cloud-config-errors"]}' \
            > "$RUNNER_TEMP/codex-runtime-contract.json"

      - name: Upload runtime contract proof
        uses: actions/upload-artifact@v4
        with:
          name: codex-runtime-contract-${{ matrix.os }}-${{ matrix.codex-version }}
          path: ${{ runner.temp }}/codex-runtime-contract.json

  full-go-test:
    name: Full go test (${{ matrix.os }} / partition ${{ matrix.partition }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        partition: [0, 1]
        exclude:
          # Linux owns the combined coverage profile and is already the
          # shortest full-suite job. Split only the non-Linux suites, whose
          # local shard pool is intentionally capped for SQLite safety.
          - os: ubuntu-latest
            partition: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: go test (with coverage, Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash scripts/ci/run_linux_full_go_test_collect.sh

      - name: go test (without coverage, non-Linux)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/full-go-test.log"
          # Run every discovered Test/Example/Fuzz entry exactly once, in
          # bounded prefix shards so one package test process cannot spend
          # the entire 20-minute watchdog behind unrelated fixtures. The
          # end-to-end scenarios run in the Linux e2e job.
          if ! go run ./scripts/ci/run_full_go_test_shards.go -timeout=20m -parallel=16 -shards=16 -partition-count=2 -partition-index="${{ matrix.partition }}" -exclude-prefix=github.com/baaaaaaaka/codex-helper/internal/e2e/scenarios/ 2>&1 | tee "$log"; then
            summary="$(grep -E -A8 '^--- FAIL:|^FAIL[[:space:]]|^panic:|^fatal error:' "$log" | tail -80 | tr '\n' ' ' || true)"
            if ! grep -Eq '^--- FAIL:|^panic:|^fatal error:' "$log"; then
              summary="$(tail -40 "$log" | tr '\n' ' ')"
            fi
            echo "::error title=Full Go test failure::${summary:-go test failed without a recognized summary; inspect the retained step log}"
            # A passing retry of internal/cli cannot diagnose a failure in
            # another package, or establish contention as its cause. Keep the
            # original shard failure authoritative; reproduce that exact
            # package/test and mode separately when investigating it.
            exit 1
          fi

      - name: Upload full-suite diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: full-go-test-diagnostics-${{ matrix.os }}-${{ matrix.partition }}
          path: |
            ${{ runner.temp }}/full-go-test*.log
            ${{ runner.temp }}/migration-process-isolated.log
          if-no-files-found: ignore

      - name: Coverage gate (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          threshold="40.0"
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$NF); print $NF}')"
          echo "Total coverage: ${total}% (threshold ${threshold}%)"
          awk -v total="$total" -v threshold="$threshold" 'BEGIN { if (total+0 < threshold+0) { printf("coverage %.2f%% < %.2f%%\n", total, threshold); exit 1 } }'

      - name: Upload coverage artifact (Linux only)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  race-test:
    name: Race test (ubuntu-latest / partition ${{ matrix.partition }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Race shards are independent hosted runners. Eight partitions keep
        # the long exact-test/exclusive tail below the 45-minute job budget;
        # each partition still receives complete test processes and the
        # runner validates exact-once coverage before execution.
        partition: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: go test -race (Linux only)
        shell: bash
        run: |
          set -o pipefail
          # Every package except the end-to-end scenarios (their system
          # under test is a separate process); the core and the Teams channel
          # adapter are included.
          go run ./scripts/ci/run_full_go_test_shards.go -race -timeout=30m -parallel=16 -shards=16 -partition-count=8 -partition-index="${{ matrix.partition }}" -exclude-prefix=github.com/baaaaaaaka/codex-helper/internal/e2e/scenarios/ 2>&1 | tee "$RUNNER_TEMP/race-test.log"

      - name: Core and channel race with leak checks
        if: matrix.partition == 0
        shell: bash
        run: |
          set -o pipefail
          # The core packages check for leaked goroutines when their tests
          # end; run them once more as a whole so that check sees every test.
          go test -race -count=1 -timeout=20m ./internal/core/... ./internal/channel/... 2>&1 | tee "$RUNNER_TEMP/race-core.log"

      - name: Upload race diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: race-test-diagnostics-${{ matrix.partition }}
          path: |
            ${{ runner.temp }}/race-test.log
            ${{ runner.temp }}/race-core.log
          if-no-files-found: ignore

  e2e:
    name: End-to-end scenarios (ubuntu-latest / cxp)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Scenarios through the production entry point
        shell: bash
        env:
          E2E_SUT: cxp
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          # The scenarios drive `cxp teams run` (e2e build tag) against a fake
          # Graph service and a fake Codex app-server; nothing leaves the
          # runner.
          go test -count=1 -timeout=600s ./internal/e2e/scenarios/... 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      - name: Upload e2e diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: ${{ runner.temp }}/e2e.log
          if-no-files-found: ignore

  runtime-env-contract:
    name: Runtime environment contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Managed Node and app-server environment contracts
        shell: bash
        run: |
          set -euo pipefail
          cli_pattern='Test(TeamsStandardRuntimeRefreshesManagedNodePATHAfterExecutorCreation|TeamsAppServerReceivesUserPathInsteadOfServiceOrManagedRuntime|ApplyTeamsUserPathRuntime.*|ResolveTeamsCodexUserPath.*|CommandLooksNative.*|RunCodexNewSessionUsesManagedNodeWithoutSystemNode|CodexRuntimeEnvironment.*|MergeCLIEnvironment.*|CodexAppAuthIdentityRuntimeEnvPrependsTargetManagedNode|RunTargetOnceWithOptionsRemovesRuntimeMarkers|StartCodexDesktopProcessPassesProxyArgAndEnv)$'
          process_pattern='Test(MergeAppServerProcessEnv.*|AppServerProcessStarter(RemovesInheritedRuntimeMarkers|RemovesRuntimeMarkersAfterConfiguration|NilConfiguredEnvironmentKeepsSanitizedParent)|AppServerRunnerRetries(LaunchFailureBeforeInitialization|TransportFailureDuringInitialization))$'
          go test ./internal/cli -count=1 -run "$cli_pattern" -v
          go test ./internal/codexrunner -count=1 -run "$process_pattern" -v

  linux-distro-smoke-build:
    name: Linux distro smoke build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Build static linux-amd64 binary
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/codex-proxy ./cmd/codex-proxy
          chmod +x dist/codex-proxy

      - name: Build CLI test binary
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test ./internal/cli -c -o dist/codex_cli_test
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test ./internal/codexcontract -c -o dist/codex_contract_test
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test ./internal/codexrunner -c -o dist/codex_runtime_test
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test ./internal/proc -c -o dist/codex_proc_test
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test ./internal/core/engine -c -o dist/codex_core_engine_test
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test ./internal/core/store -c -o dist/codex_core_store_test
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test ./internal/channel/teams -c -o dist/codex_channel_teams_test
          chmod +x dist/codex_cli_test dist/codex_contract_test dist/codex_runtime_test dist/codex_proc_test dist/codex_core_engine_test dist/codex_core_store_test dist/codex_channel_teams_test

      - name: Upload Linux distro smoke binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-distro-smoke-dist
          path: dist/
          if-no-files-found: error

  linux-distro-smoke:
    name: Linux distro smoke (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: [linux-distro-smoke-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: CentOS7
            image: centos:7.9.2009
            package_args: ca-certificates curl xz tar procps-ng util-linux python36 binutils
            path_activation_package_args: zsh tcsh
            path_activation_cases: sh bash zsh csh tcsh
          - label: Rocky8
            image: rockylinux:8
            package_args: ca-certificates curl xz tar procps-ng util-linux python3 binutils
            path_activation_package_args: zsh tcsh
            path_activation_cases: sh bash zsh csh tcsh
          - label: Ubuntu20.04
            image: ubuntu:20.04
            package_args: ca-certificates curl xz-utils tar procps util-linux python3 binutils
            path_activation_package_args: zsh fish csh tcsh
            path_activation_cases: sh bash zsh fish csh tcsh
    env:
      DISTRO_IMAGE: ${{ matrix.image }}
      DISTRO_PACKAGE_ARGS: ${{ matrix.package_args }}
      PATH_ACTIVATION_PACKAGE_ARGS: ${{ matrix.path_activation_package_args }}
      PATH_ACTIVATION_CASES: ${{ matrix.path_activation_cases }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux distro smoke binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-distro-smoke-dist
          path: dist

      - name: Restore executable bits
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required=(
            dist/codex-proxy
            dist/codex_cli_test
            dist/codex_contract_test
            dist/codex_runtime_test
            dist/codex_proc_test
            dist/codex_core_engine_test
            dist/codex_core_store_test
            dist/codex_channel_teams_test
          )
          missing_required() {
            local missing=0
            for file in "${required[@]}"; do
              if [ ! -f "$file" ]; then
                echo "missing artifact file: $file" >&2
                missing=1
              fi
            done
            return "$missing"
          }
          if ! missing_required; then
            echo "::warning::download-artifact completed without all expected distro smoke binaries; retrying with gh run download"
            rm -rf dist
            for attempt in 1 2 3; do
              mkdir -p dist
              if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name linux-distro-smoke-dist --dir dist && missing_required; then
                break
              fi
              rm -rf dist
              if [ "$attempt" = 3 ]; then
                echo "linux-distro-smoke-dist artifact is still incomplete after retries" >&2
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi
          chmod +x "${required[@]}"

      - name: Teams managed ASR native dependency scan
        id: teams_asr_dependency_scan
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          img="$DISTRO_IMAGE"
          report_label="$(printf '%s' "${{ matrix.label }}" | tr '[:upper:]' '[:lower:]')"
          mkdir -p teams-asr-dependency-scan
          echo "==> $img (Teams managed ASR native dependency scan)"
          docker run --rm \
            -e DISTRO_PACKAGE_ARGS="$DISTRO_PACKAGE_ARGS" \
            -e REPORT_LABEL="$report_label" \
            -e ASR_SCAN_PYTHON_PROBE="${ASR_SCAN_PYTHON_PROBE:-audio}" \
            -v "$PWD/scripts/ci:/ci:ro" \
            -v "$PWD/teams-asr-dependency-scan:/reports" \
            "$img" bash -lc '
              set -euo pipefail
              report_json="/reports/${REPORT_LABEL}.json"
              report_text="/reports/${REPORT_LABEL}.txt"
              write_setup_failure_report() {
                local detail="$1"
                cat > "$report_json" <<EOF
          {
            "issues": [
              {
                "component": "ci-setup",
                "detail": "$detail",
                "kind": "setup_failed",
                "library": "",
                "path": "${REPORT_LABEL}",
                "required_version": ""
              }
            ],
            "missing_libraries": [],
            "missing_symbol_versions": [],
            "native_files": [],
            "native_files_scanned": 0,
            "needed_libraries": [],
            "required_versions": [],
            "scanner_version": 1
          }
          EOF
                cat > "$report_text" <<EOF
          Teams ASR dependency scan
          status: FAILED
          native files scanned: 0

          Setup failed before the scanner could write a full report:
            $detail
          EOF
              }
              if command -v apt-get >/dev/null 2>&1 || command -v dnf >/dev/null 2>&1 || command -v yum >/dev/null 2>&1; then
                # shellcheck disable=SC2086
                if ! bash /ci/install_container_packages.sh $DISTRO_PACKAGE_ARGS; then
                  write_setup_failure_report "package installation failed"
                  exit 1
                fi
              else
                echo "unsupported package manager for Teams ASR dependency scan"
                write_setup_failure_report "unsupported package manager"
                exit 1
              fi
              python_bin="$(command -v python3 || true)"
              if [ -z "$python_bin" ]; then
                python_bin="$(command -v python3.6 || true)"
              fi
              if [ -z "$python_bin" ]; then
                echo "python3 is required to run Teams ASR dependency scan"
                write_setup_failure_report "python3 is required"
                exit 1
              fi
              set +e
              "$python_bin" /ci/teams_asr_dependency_scan.py \
                --work-dir /tmp/teams-asr-dependency-scan \
                --report-json "$report_json" \
                --report-text "$report_text" \
                --python-probe "${ASR_SCAN_PYTHON_PROBE:-audio}"
              scan_status="$?"
              set -e
              if [ ! -s "$report_json" ] || [ ! -s "$report_text" ]; then
                write_setup_failure_report "scanner exited with status ${scan_status} before writing reports"
              fi
              exit "$scan_status"
            '

      - name: Upload Teams managed ASR dependency scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teams-asr-dependency-scan-${{ matrix.label }}
          path: teams-asr-dependency-scan/
          if-no-files-found: warn

      - name: Assert Teams managed ASR dependency scan coverage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report_label="$(printf '%s' "${{ matrix.label }}" | tr '[:upper:]' '[:lower:]')"
          python3 scripts/ci/assert_teams_asr_dependency_report.py \
            --report-json "teams-asr-dependency-scan/${report_label}.json" \
            --label "${{ matrix.label }}" \
            --expected-cpu-plan-status repairable

      - name: Smoke test in container (doctor)
        shell: bash
        run: |
          set -euo pipefail
          img="$DISTRO_IMAGE"
          echo "==> $img"
          if [ "$img" = "centos:7.9.2009" ]; then
            docker run --rm \
              -v "$PWD/dist:/dist:ro" \
              -v "$PWD/scripts/ci:/ci:ro" \
              "$img" bash -c '
              bash /ci/configure_container_repos.sh centos-vault
              /dist/codex-proxy proxy doctor'
          else
            docker run --rm -v "$PWD/dist:/dist:ro" "$img" /dist/codex-proxy proxy doctor
          fi

      - name: Installer PATH activation matrix in container
        shell: bash
        run: |
          set -euo pipefail
          img="$DISTRO_IMAGE"
          docker run --rm \
            -e DISTRO_PACKAGE_ARGS="$DISTRO_PACKAGE_ARGS $PATH_ACTIVATION_PACKAGE_ARGS" \
            -e CODEX_PROXY_REQUIRE_SHELL_MATRIX=1 \
            -e CODEX_PROXY_SHELL_MATRIX_CASES="$PATH_ACTIVATION_CASES" \
            -v "$PWD:/repo:ro" \
            -v "$PWD/scripts/ci:/ci:ro" \
            "$img" bash -lc '
              set -euo pipefail
              if command -v apt-get >/dev/null 2>&1 || command -v dnf >/dev/null 2>&1 || command -v yum >/dev/null 2>&1; then
                # shellcheck disable=SC2086
                bash /ci/install_container_packages.sh $DISTRO_PACKAGE_ARGS
              fi
              bash /repo/scripts/ci/install_path_activation_matrix.sh
            '

      - name: Run tests in containers
        shell: bash
        run: |
          set -euo pipefail
          trap 'status=$?; echo "::error title=Linux distro smoke command failed::${BASH_COMMAND} (exit ${status})"' ERR
          img="$DISTRO_IMAGE"
          echo "==> $img (Codex contract tests)"
          docker run --rm -v "$PWD/dist:/dist:ro" "$img" \
            /dist/codex_contract_test -test.v -test.count=1
          echo "==> $img (Codex runtime tests)"
          docker run --rm -v "$PWD/dist:/dist:ro" "$img" \
            /dist/codex_runtime_test -test.v -test.count=1
          echo "==> $img (cli tests)"
          docker run --rm -v "$PWD/dist:/dist:ro" "$img" \
            /dist/codex_cli_test -test.v -test.count=1 -test.run='Test[^I]'
          echo "==> $img (proc zombie/parser tests)"
          docker run --rm -v "$PWD/dist:/dist:ro" "$img" \
            /dist/codex_proc_test -test.v -test.count=1 -test.run='Test(IsAliveTreatsLinuxZombieAsDead|LinuxProcStateFromStatParsesLastParen)$'
          echo "==> $img (Teams core store, engine, and channel adapter tests)"
          docker run --rm -v "$PWD/dist:/dist:ro" "$img" \
            /dist/codex_core_store_test -test.count=1
          docker run --rm -v "$PWD/dist:/dist:ro" "$img" \
            /dist/codex_core_engine_test -test.count=1
          docker run --rm -v "$PWD/dist:/dist:ro" "$img" \
            /dist/codex_channel_teams_test -test.count=1

      - name: Teams background keepalive tests in containers (non-root)
        shell: bash
        run: |
          set -euo pipefail
          img="$DISTRO_IMAGE"
          echo "==> $img (Teams keepalive tests as non-root uid 1000)"
          docker run --rm --user 1000:1000 \
            -e HOME=/tmp/codex-home \
            -e XDG_CONFIG_HOME=/tmp/codex-config \
            -e XDG_CACHE_HOME=/tmp/codex-cache \
            -e CODEX_HELPER_TEAMS_TOKEN_CACHE=/tmp/codex-cache/teams-missing-token.json \
            -e CODEX_HELPER_TEAMS_READ_TOKEN_CACHE=/tmp/codex-cache/teams-missing-read-token.json \
            -e CODEX_HELPER_TEAMS_FILE_WRITE_TOKEN_CACHE=/tmp/codex-cache/teams-missing-file-token.json \
            -v "$PWD/dist:/dist:ro" "$img" \
            /dist/codex_cli_test -test.v -test.count=1 -test.run='TestTeamsBackgroundKeepalive'
          echo "==> $img (Teams core store, engine, and channel adapter tests as non-root uid 1000)"
          docker run --rm --user 1000:1000 \
            -e HOME=/tmp/codex-home \
            -v "$PWD/dist:/dist:ro" "$img" \
            /dist/codex_core_store_test -test.count=1
          docker run --rm --user 1000:1000 \
            -e HOME=/tmp/codex-home \
            -v "$PWD/dist:/dist:ro" "$img" \
            /dist/codex_core_engine_test -test.count=1
          docker run --rm --user 1000:1000 \
            -e HOME=/tmp/codex-home \
            -v "$PWD/dist:/dist:ro" "$img" \
            /dist/codex_channel_teams_test -test.count=1
          echo "==> $img (Teams detached supervisor smoke as non-root uid 1000)"
          docker run --rm --user 1000:1000 \
            -e HOME=/tmp/codex-home \
            -e RUNNER_TEMP=/tmp/codex-runner-temp \
            -e CODEX_HELPER_CI_CXP=/dist/codex-proxy \
            -v "$PWD/dist:/dist:ro" \
            -v "$PWD/scripts/ci:/ci:ro" "$img" \
            bash /ci/teams_supervisor_smoke.sh

      - name: Codex upgrade smoke in Linux containers (system/local)
        shell: bash
        run: |
          set -euo pipefail
          img="$DISTRO_IMAGE"
          echo "==> $img (codex upgrade command)"
          docker run --rm \
            -e DISTRO_PACKAGE_ARGS="$DISTRO_PACKAGE_ARGS" \
            -v "$PWD/dist:/dist:ro" \
            -v "$PWD/scripts/ci:/ci:ro" \
            "$img" bash -lc '
              set -euo pipefail
              if command -v apt-get >/dev/null 2>&1 || command -v dnf >/dev/null 2>&1 || command -v yum >/dev/null 2>&1; then
                # shellcheck disable=SC2086
                bash /ci/install_container_packages.sh $DISTRO_PACKAGE_ARGS
              else
                echo "unsupported package manager for codex upgrade smoke"
                exit 1
              fi

              NODE_MIN_MAJOR=16 NODE_MAJOR=22 NODE_BIN_DIR="$(bash /ci/install_node_local.sh)"
              export PATH="$NODE_BIN_DIR:$PATH"

              bash /ci/retry.sh 5 5 npm install -g --include=optional @openai/codex
              system_prefix="$(npm prefix -g)"
              system_codex_path="$(command -v codex)"
              /dist/codex-proxy --config /tmp/codex-upgrade-system.json --upgrade-codex --upgrade-codex-path "$system_codex_path"
              codex --version >/dev/null
              system_path="$(command -v codex)"
              case "$system_path" in
                "$system_prefix"/*) ;;
                *)
                  echo "expected system codex under $system_prefix, got $system_path"
                  exit 1
                  ;;
              esac

              local_prefix="/tmp/codex-local-prefix"
              bash /ci/retry.sh 5 5 npm install -g --prefix "$local_prefix" --include=optional @openai/codex
              path_codex_before="$(command -v codex)"
              export CODEX_NPM_PREFIX="$local_prefix"
              /dist/codex-proxy --config /tmp/codex-upgrade-local.json --upgrade-codex
              "$local_prefix/bin/codex" --version >/dev/null
              path_codex_after="$(command -v codex)"
              if [ "$path_codex_after" != "$path_codex_before" ]; then
                echo "default managed upgrade changed PATH-selected Codex from $path_codex_before to $path_codex_after"
                exit 1
              fi
            '

  test:
    name: Test
    runs-on: ubuntu-latest
    needs:
      - targeted-test
      - e2e
      - proxy-recovery-loopback
      - windows-proxy-lifecycle
      - proxy-recovery-docker
      - proxy-recovery-soak
      - app-gateway-lifecycle
      - full-go-test
      - race-test
      - runtime-env-contract
      - linux-distro-smoke-build
      - linux-distro-smoke
    if: ${{ always() }}

    steps:
      - name: Verify parallel CI shards
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          check() {
            name="$1"
            result="$2"
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              failures=$((failures + 1))
            fi
          }
          check targeted-test "${{ needs.targeted-test.result }}"
          check e2e "${{ needs.e2e.result }}"
          check proxy-recovery-loopback "${{ needs.proxy-recovery-loopback.result }}"
          check windows-proxy-lifecycle "${{ needs.windows-proxy-lifecycle.result }}"
          check proxy-recovery-docker "${{ needs.proxy-recovery-docker.result }}"
          check proxy-recovery-soak "${{ needs.proxy-recovery-soak.result }}"
          check app-gateway-lifecycle "${{ needs.app-gateway-lifecycle.result }}"
          check full-go-test "${{ needs.full-go-test.result }}"
          check race-test "${{ needs.race-test.result }}"
          check runtime-env-contract "${{ needs.runtime-env-contract.result }}"
          check linux-distro-smoke-build "${{ needs.linux-distro-smoke-build.result }}"
          check linux-distro-smoke "${{ needs.linux-distro-smoke.result }}"
          if [ "$failures" -ne 0 ]; then
            echo "$failures CI shard(s) failed or did not run"
            exit 1
          fi
