              ;;
            Darwin-x86_64)
              target=x86_64-apple-darwin
              llama_urls=("https://github.com/ggml-org/llama.cpp/releases/download/b9437/llama-b9437-bin-macos-x64.tar.gz")
              ffmpeg_url="https://files.pythonhosted.org/packages/da/58/87ef68ac83f4c7690961bce288fd8e382bc5f1513860fc7f90a9c1c1c6bf/imageio_ffmpeg-0.6.0-py3-none-macosx_10_9_intel.macosx_10_9_x86_64.whl"
              ;;
            Darwin-arm64)
              target=aarch64-apple-darwin
              llama_urls=("https://github.com/ggml-org/llama.cpp/releases/download/b9437/llama-b9437-bin-macos-arm64.tar.gz")
              ffmpeg_url="https://files.pythonhosted.org/packages/40/5c/f3d8a657d362cc93b81aab8feda487317da5b5d31c0e1fdfd5e986e55d17/imageio_ffmpeg-0.6.0-py3-none-macosx_11_0_arm64.whl"
              ;;
            *) echo "unsupported CI platform for managed Python check: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          url="https://github.com/astral-sh/python-build-standalone/releases/download/20260510/cpython-3.10.20+20260510-${target}-install_only_stripped.tar.gz"
          check_url "$url"
